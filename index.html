<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Group Management System</title>
<meta name="description" content="Weekly progress, characterization tracking, and paper pipeline management for research groups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F7;
    --surface:#FFFFFF;
    --border:#E1E4EA;
    --border-strong:#CBD1DB;
    --ink:#151B29;
    --ink-soft:#5C6478;
    --ink-faint:#8A90A2;
    --navy:#1F3A5F;
    --navy-dark:#152A46;
    --navy-wash:#E9EEF5;
    --success:#166A4C;
    --success-wash:#E4F4EC;
    --warning:#8A5A0B;
    --warning-wash:#FBF0DD;
    --danger:#A32A24;
    --danger-wash:#FBEAE9;
    --neutral-wash:#EEF0F3;
    --stat-blue:#2B5FA8;
    --stat-blue-wash:#E7EEF8;
    --stat-purple:#6E4A9E;
    --stat-purple-wash:#EFE7F5;
    --stat-teal:#0E7C86;
    --stat-teal-wash:#E1F2F1;
    --stat-indigo:#4A54A8;
    --stat-indigo-wash:#ECEDF7;
    --shadow-sm: 0 1px 2px rgba(21,27,41,0.05);
    --shadow-md: 0 2px 6px rgba(21,27,41,0.06), 0 8px 24px rgba(21,27,41,0.05);
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Inter', sans-serif; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  button{ font-family:'Inter', sans-serif; cursor:pointer; }
  input,select,textarea{ font-family:'Inter', sans-serif; }
  ::selection{ background:var(--navy-wash); }
  a{ color:var(--navy); }

  /* ---------- Login ---------- */
  #loginScreen{ min-height:100vh; display:flex; align-items:stretch; justify-content:center; padding:0; background:var(--bg); }
  .login-hero{
    flex:1 1 380px; max-width:460px; background:linear-gradient(155deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:56px 48px; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden;
  }
  .login-hero:before{ content:""; position:absolute; width:340px; height:340px; border-radius:50%; background:rgba(255,255,255,0.05); top:-120px; right:-120px; }
  .login-hero:after{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,0.04); bottom:-90px; left:-70px; }
  .login-hero-mark{ width:44px; height:44px; border-radius:10px; background:#fff; color:var(--navy-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; margin-bottom:24px; position:relative; z-index:1; }
  .login-hero-title{ font-size:27px; font-weight:700; line-height:1.28; letter-spacing:-0.015em; margin-bottom:14px; position:relative; z-index:1; }
  .login-hero-tag{ font-size:14px; line-height:1.65; color:rgba(255,255,255,0.72); max-width:360px; margin-bottom:28px; position:relative; z-index:1; }
  .login-hero-list{ list-style:none; padding:0; margin:0 0 32px; display:flex; flex-direction:column; gap:11px; position:relative; z-index:1; }
  .login-hero-list li{ font-size:13.5px; color:rgba(255,255,255,0.92); padding-left:24px; position:relative; }
  .login-hero-list li:before{ content:"✓"; position:absolute; left:0; top:0; color:#8FD6C4; font-weight:700; }
  .login-hero-foot{ font-size:11px; color:rgba(255,255,255,0.38); letter-spacing:.06em; text-transform:uppercase; position:relative; z-index:1; }
  .login-card-wrap{ flex:1 1 480px; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
  @keyframes loginFadeIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .login-card{
    width:100%; max-width:440px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow-md); padding:40px 36px;
    animation: loginFadeIn .4s cubic-bezier(.2,.7,.3,1);
  }
  @media (max-width: 860px){
    .login-hero{ display:none; }
    .login-card-wrap{ flex:1 1 100%; padding:24px 18px; }
  }
  .login-mark{ width:38px; height:38px; border-radius:8px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; letter-spacing:0.02em; margin-bottom:18px; }
  .login-eyebrow{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; }
  .login-title{ font-size:24px; font-weight:700; margin:6px 0 6px; letter-spacing:-0.015em; }
  .login-sub{ color:var(--ink-soft); font-size:14px; margin-bottom:28px; line-height:1.55; }
  .role-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .role-row .role-btn{ flex:1 1 140px; }
  .role-btn{
    flex:1; padding:14px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    font-weight:600; font-size:14px; color:var(--ink-soft); transition:all .12s ease; text-align:left;
  }
  .role-btn small{ display:block; font-weight:400; font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .role-btn.active{ border-color:var(--navy); background:var(--navy-wash); color:var(--navy-dark); box-shadow:inset 0 0 0 1px var(--navy); }
  .field-label{ font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px; display:block; }
  .text-input, select.text-input, textarea.text-input{
    width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:7px; font-size:14px; color:var(--ink); background:var(--surface);
  }
  .text-input:focus, select:focus, textarea:focus{ outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy); }
  .student-pick-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .pick-chip{ padding:7px 13px; border-radius:20px; border:1px solid var(--border-strong); background:var(--surface); font-size:13px; font-weight:500; color:var(--ink-soft); }
  .pick-chip.active{ border-color:var(--navy); background:var(--navy); color:#fff; }
  .primary-btn{
    width:100%; margin-top:24px; padding:13px; background:var(--navy); color:#fff; border:none; border-radius:7px;
    font-weight:600; font-size:14.5px; letter-spacing:.01em; transition:background .12s;
  }
  .primary-btn:hover{ background:var(--navy-dark); }
  .primary-btn:disabled{ background:var(--border-strong); cursor:not-allowed; }

  /* ---------- App shell ---------- */
  #appShell{ display:none; min-height:100vh; }
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; background:var(--navy-dark); border-bottom:1px solid var(--navy-dark);
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{ width:30px; height:30px; border-radius:7px; background:#fff; color:var(--navy-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .brand-name{ font-weight:600; font-size:15px; letter-spacing:-0.005em; color:#fff; }
  .identity-pill{ display:flex; align-items:center; gap:14px; }
  .identity-badge{ font-size:13px; padding:6px 13px; border-radius:20px; background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.14); }
  .identity-badge b{ font-weight:600; }
  .switch-link{ font-size:12.5px; color:rgba(255,255,255,0.65); background:none; border:none; text-decoration:none; padding:4px; font-weight:500; }
  .switch-link:hover{ color:#fff; text-decoration:underline; }

  .layout{ display:flex; align-items:flex-start; }
  .sidebar{ width:210px; flex-shrink:0; padding:20px 14px; position:sticky; top:57px; height:calc(100vh - 57px); background:var(--surface); border-right:1px solid var(--border); }
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border-radius:7px;
    border:none; background:none; font-size:13.5px; font-weight:500; color:var(--ink-soft); margin-bottom:2px;
  }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--border-strong); }
  .nav-item.active{ background:var(--navy-wash); color:var(--navy-dark); font-weight:600; }
  .nav-item.active .dot{ background:var(--navy); }
  .nav-item:hover:not(.active){ background:var(--neutral-wash); }

  main#main{ flex:1; padding:28px 34px 64px; min-width:0; }
  .view-header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--border); }
  .view-title{ font-size:20px; font-weight:700; letter-spacing:-0.015em; }
  .view-sub{ color:var(--ink-soft); font-size:13.5px; margin-top:4px; }
  .action-btn{
    padding:9px 16px; background:var(--navy); color:#fff; border:none; border-radius:7px; font-weight:600; font-size:13.5px;
    display:inline-flex; align-items:center; gap:6px; transition:background .12s;
  }
  .action-btn:hover{ background:var(--navy-dark); }
  .action-btn.ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--border-strong); }
  .action-btn.ghost:hover{ background:var(--neutral-wash); }

  .filter-row{ display:flex; gap:8px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .filter-row select{ padding:8px 11px; border-radius:7px; border:1px solid var(--border-strong); font-size:13px; background:var(--surface); color:var(--ink); }

  /* ---------- Dashboard cards ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(168px,1fr)); gap:14px; margin-bottom:30px; }
  .stat-grid.compact{ grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--border-strong); border-radius:var(--radius); padding:17px 19px; box-shadow:var(--shadow-sm); transition:box-shadow .15s, transform .15s; }
  .stat-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .stat-card.compact{ padding:13px 15px; }
  .stat-card.compact .stat-num{ font-size:22px; }
  .stat-card.compact .stat-label{ font-size:11px; margin-top:2px; }
  .stat-num{ font-size:27px; font-weight:700; letter-spacing:-0.02em; color:var(--ink); }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:3px; font-weight:500; display:flex; align-items:center; gap:6px; }
  .stat-label .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .stat-card.warn{ border-top-color:var(--danger); }
  .stat-card.warn .stat-num{ color:var(--danger); }
  .stat-card.ok{ border-top-color:var(--success); }
  .stat-card.ok .stat-num{ color:var(--success); }
  .stat-card.accent-blue{ border-top-color:var(--stat-blue); }
  .stat-card.accent-blue .dot{ background:var(--stat-blue); }
  .stat-card.accent-purple{ border-top-color:var(--stat-purple); }
  .stat-card.accent-purple .dot{ background:var(--stat-purple); }
  .stat-card.accent-teal{ border-top-color:var(--stat-teal); }
  .stat-card.accent-teal .dot{ background:var(--stat-teal); }
  .stat-card.accent-indigo{ border-top-color:var(--stat-indigo); }
  .stat-card.accent-indigo .dot{ background:var(--stat-indigo); }
  .stat-card.warn .dot{ background:var(--danger); }
  .stat-card.ok .dot{ background:var(--success); }

  .panel-title{ font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; margin:0 0 8px; display:flex; align-items:center; gap:7px; }
  .panel-title .dot{ width:7px; height:7px; border-radius:50%; }
  .two-col-panels{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  .compact-card{ padding:8px 16px; margin-bottom:0; }

  .feed-item{ display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
  .feed-item.compact{ padding:8px 0; gap:10px; }
  .feed-item.compact .feed-body{ font-size:12.5px; line-height:1.45; }
  .feed-item:last-child{ border-bottom:none; }
  .feed-idx{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); width:26px; flex-shrink:0; padding-top:2px; }
  .feed-idx.mono{ width:64px; font-size:11px; }
  .feed-body{ flex:1; font-size:13.5px; line-height:1.55; color:var(--ink); }
  .feed-body b{ font-weight:600; }
  .feed-date{ color:var(--ink-faint); font-size:12px; }

  @media (max-width: 900px){
    .two-col-panels{ grid-template-columns:1fr; }
  }


  /* ---------- Entry cards ---------- */
  .entry-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);
    padding:20px 22px; margin-bottom:14px;
  }
  .entry-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .entry-idx{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); letter-spacing:.03em; text-transform:uppercase; }
  .entry-title{ font-size:15px; font-weight:600; margin-top:3px; color:var(--ink); }
  .entry-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .stamp{
    font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:5px 11px; border-radius:20px; white-space:nowrap;
  }
  .stamp.good{ color:var(--success); background:var(--success-wash); }
  .stamp.warn{ color:var(--warning); background:var(--warning-wash); }
  .stamp.bad{ color:var(--danger); background:var(--danger-wash); }
  .stamp.neutral{ color:var(--ink-soft); background:var(--neutral-wash); }

  .entry-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:4px; }
  .entry-block{ font-size:13.5px; line-height:1.6; color:var(--ink); }
  .entry-block .lbl{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); display:block; margin-bottom:4px; }
  .entry-actions{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .small-btn{ padding:7px 13px; font-size:12.5px; font-weight:600; border-radius:6px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); }
  .small-btn:hover{ border-color:var(--navy); color:var(--navy-dark); background:var(--navy-wash); }
  .small-btn.danger:hover{ border-color:var(--danger); color:var(--danger); background:var(--danger-wash); }
  .comment-box{ margin-top:14px; background:var(--navy-wash); border-radius:7px; padding:14px 16px; }
  .comment-box .lbl{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--navy-dark); display:block; margin-bottom:7px;}
  .comment-box textarea{ width:100%; border:1px solid var(--border-strong); border-radius:6px; padding:9px 10px; font-size:13px; min-height:64px; resize:vertical; }
  .comment-existing{ font-size:13.5px; line-height:1.55; color:var(--ink); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .em-title{ font-weight:600; color:var(--ink); font-size:15px; margin-bottom:6px; }
  .empty-state .em-sub{ font-size:13.5px; max-width:360px; margin:0 auto; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(15,20,32,0.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; }
  .modal-box{ background:var(--surface); border-radius:10px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,0.28); }
  .modal-head{ padding:20px 24px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .modal-head h3{ font-size:16px; font-weight:600; }
  .modal-close{ background:none; border:none; font-size:20px; color:var(--ink-faint); line-height:1; padding:4px; }
  .modal-body{ padding:20px 24px 24px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ---------- Report document ---------- */
  .report-doc{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:32px 36px; }
  .report-head{ border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:24px; }
  .report-eyebrow{ font-size:18px; font-weight:700; letter-spacing:-0.01em; }
  .report-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .report-divider{ border-top:1px dashed var(--border-strong); margin:30px 0; }
  .report-student-name{ font-size:19px; font-weight:700; margin:0 0 14px; }
  .report-section-title{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--navy); margin:22px 0 10px; padding-top:14px; border-top:1px solid var(--border); }
  .report-section-title:first-of-type{ border-top:none; padding-top:0; }
  .report-empty{ font-size:13px; color:var(--ink-faint); font-style:italic; }
  .report-entry{ font-size:13.5px; line-height:1.6; padding:12px 0; border-bottom:1px solid var(--border); }
  .report-entry:last-child{ border-bottom:none; }
  .report-entry-head{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .report-entry p{ margin:4px 0; }
  .report-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:8px; }
  .report-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:1.5px solid var(--border-strong); padding:6px 8px; }
  .report-table td{ padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }

  @media print {
    body * { visibility:hidden; }
    #reportPrintArea, #reportPrintArea * { visibility:visible; }
    #reportPrintArea{ position:absolute; left:0; top:0; width:100%; margin:0; padding:0; }
    .report-doc{ box-shadow:none; border:none; padding:0; }
  }

  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    .sidebar{ position:static; width:100%; height:auto; display:flex; gap:6px; overflow-x:auto; padding:12px 16px; border-right:none; border-bottom:1px solid var(--border); }
    .nav-item{ white-space:nowrap; }
    main#main{ padding:20px 16px 48px; }
    .entry-grid{ grid-template-columns:1fr; }
    .two-col{ grid-template-columns:1fr; }
    .topbar{ padding:12px 16px; }
  }
</style>
</head>
<body>

<div id="loginScreen"></div>

<div id="appShell">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">RG</div>
      <div class="brand-name">Research Group Management System</div>
      <span style="font-size:10.5px; color:rgba(255,255,255,0.45); font-weight:600; letter-spacing:.04em; border:1px solid rgba(255,255,255,0.2); border-radius:4px; padding:1px 6px;">v1.0</span>
    </div>
    <div class="identity-pill">
      <span class="identity-badge" id="identityBadge"></span>
      <button class="switch-link" onclick="switchUser()">switch user</button>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="modalRoot"></div>

<script>
/* ============================ STATE ============================ */
const state = {
  identity: null,        // {role:'supervisor'|'cosupervisor'|'student', id, name}
  students: [],
  weekly: [],
  samples: [],
  papers: [],
  instructions: [],
  meetings: [],
  coSupervisors: [],
  readings: [],
  view: 'overview',
  filterStudentId: 'all',
  filterMeetingType: 'all',
  loginRole: null,
  loginPickId: null,
  supervisorPinHash: null, // null = no supervisor passcode set yet
  supervisorEmail: null,
  loginError: '',
  reportStudentId: null,
  reportFrom: '',
  reportTo: '',
  reportData: null
};

const MEETING_TYPES = ['Weekly Review','Monthly Presentation','Topic Discussion','Other'];

const TECHNIQUES = ['CV (Cyclic Voltammetry)','GCD (Galvanostatic Charge-Discharge)','Battery Testing','Cycling Test','EIS (Impedance Spectroscopy)','XRD','SEM','TEM','TGA/DSC','NMR','UV-Vis','FTIR','BET (Surface Area)','XPS','Raman','GC-MS','Other'];
const PAPER_STAGES = ['Planning','Drafting','Internal Review','Submitted','Under Review','Revisions Requested','Accepted','Published'];

/* ============================ HELPERS ============================ */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }
function studentName(id){ const s = state.students.find(x=>x.id===id); return s ? s.name : 'Unknown'; }
async function hashPin(pin){
  const enc = new TextEncoder().encode('logbook-salt::' + pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Paste the "Web app URL" you get after deploying the companion Apps Script
// (backend/Code.gs) here. Until this is set, the app shows a setup screen.
const DATA_API_URL = 'https://script.google.com/macros/s/AKfycbyxhygXRw3Dx_u48TXyXdQc7l7YFqjBFeq65BSi7wMLlSwzgk8bW5SSeKVPzP9Rme4KMA/exec';

// Must exactly match the APP_KEY constant in backend/Code.gs.
const APP_KEY = 'change-this-to-your-own-random-string-2026';

function backendConfigured(){
  return typeof DATA_API_URL === 'string' && DATA_API_URL.startsWith('http');
}
async function apiGetRaw(key){
  const res = await fetch(DATA_API_URL + '?action=get&key=' + encodeURIComponent(key) + '&key_check=' + encodeURIComponent(APP_KEY));
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return (json && json.value !== undefined && json.value !== null && json.value !== '') ? json.value : null;
}
async function apiSetRaw(key, value){
  const res = await fetch(DATA_API_URL, {
    method: 'POST',
    body: JSON.stringify({ key, value, appKey: APP_KEY }) // no custom Content-Type — keeps this a "simple" request, avoiding CORS preflight issues with Apps Script
  });
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  return true;
}
async function apiNotify(type, payload){
  try{
    await fetch(DATA_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'notify', type, payload, appKey: APP_KEY })
    });
  }catch(e){ console.error('Notification failed to send', type, e); }
}
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim()); }

/* ============================ STORAGE ============================ */
async function loadCollection(key){
  try{
    const raw = await apiGetRaw(key);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ console.error('Load failed', key, e); return []; }
}
async function saveCollection(key, arr){
  try{
    await apiSetRaw(key, JSON.stringify(arr));
  }catch(e){ console.error('Storage save failed', key, e); alert('Could not save your change — check your internet connection and try again. If this keeps happening, the Drive backend link may need to be reconnected.'); }
}
async function loadSupervisorProfile(){
  try{
    const raw = await apiGetRaw('supervisor-pin');
    return raw ? JSON.parse(raw) : { hash:null, email:null };
  }catch(e){ console.error('Load supervisor profile failed', e); return { hash:null, email:null }; }
}
async function saveSupervisorProfile(profile){
  try{ await apiSetRaw('supervisor-pin', JSON.stringify(profile)); }catch(e){ console.error('Save supervisor profile failed', e); }
}

async function init(){
  if(!backendConfigured()){
    renderSetupNeeded();
    return;
  }
  renderLoginLoading();
  try{
    const [students, weekly, samples, papers, instructions, meetings, coSupervisors, readings, supervisorProfile] = await Promise.all([
      loadCollection('students'),
      loadCollection('weekly-reports'),
      loadCollection('samples'),
      loadCollection('papers'),
      loadCollection('instructions'),
      loadCollection('meetings'),
      loadCollection('co-supervisors'),
      loadCollection('readings'),
      loadSupervisorProfile()
    ]);
    state.students = students;
    state.weekly = weekly;
    state.samples = samples;
    state.papers = papers;
    state.instructions = instructions;
    state.meetings = meetings;
    state.coSupervisors = coSupervisors;

  }
}

function pickCoSupervisor(id){ state.loginPickId = id; state.loginError=''; renderLogin(); }

async function doLogin(){
  state.loginError = '';
  if(state.loginRole === 'supervisor'){
    const name = (document.getElementById('supervisorName')?.value || '').trim() || 'Supervisor';
    const pin = document.getElementById('supervisorPin')?.value || '';
    if(!pin){ state.loginError = 'Please enter the supervisor passcode.'; renderLogin(); return; }
    if(state.supervisorPinHash){
      const hash = await hashPin(pin);
      if(hash !== state.supervisorPinHash){ state.loginError = 'Incorrect passcode.'; renderLogin(); return; }
      if(!state.supervisorEmail){
        const email = (document.getElementById('supervisorEmailInput')?.value || '').trim();
        if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
        state.supervisorEmail = email;
        await saveSupervisorProfile({ hash: state.supervisorPinHash, email });
      }
    } else {
      const confirmPin = document.getElementById('supervisorPinConfirm')?.value || '';
      const email = (document.getElementById('supervisorEmailInput')?.value || '').trim();
      if(pin.length < 4){ state.loginError = 'Passcode must be at least 4 characters.'; renderLogin(); return; }
      if(pin !== confirmPin){ state.loginError = 'Passcodes do not match.'; renderLogin(); return; }
      if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
      const hash = await hashPin(pin);
      state.supervisorPinHash = hash;
      state.supervisorEmail = email;
      await saveSupervisorProfile({ hash, email });
    }
    state.identity = { role:'supervisor', id:'supervisor', name };
    showApp();
  } else if(state.loginRole === 'student'){
    if(state.loginPickId === '__new__'){
      const name = (document.getElementById('newStudentName')?.value || '').trim();
      const email = (document.getElementById('newStudentEmail')?.value || '').trim();
      const pin = document.getElementById('newStudentPin')?.value || '';
      const pinConfirm = document.getElementById('newStudentPinConfirm')?.value || '';
      if(!name){ state.loginError = 'Please enter your name.'; renderLogin(); return; }
      if(state.students.some(s=>s.name.toLowerCase()===name.toLowerCase())){ state.loginError = 'That name already exists — select it from the list above instead.'; renderLogin(); return; }
      if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
      if(pin.length < 4){ state.loginError = 'PIN must be at least 4 characters.'; renderLogin(); return; }
      if(pin !== pinConfirm){ state.loginError = 'PINs do not match.'; renderLogin(); return; }
      const pinHash = await hashPin(pin);
      const newS = { id: uid('stu'), name, email, pinHash };
      state.students.push(newS);
      await saveCollection('students', state.students);
      apiNotify('newStudent', { name });
      state.identity = { role:'student', id:newS.id, name:newS.name };
      showApp();
    } else if(state.loginPickId){
      const s = state.students.find(x=>x.id===state.loginPickId);
      if(s.pinHash){
        const pin = document.getElementById('existingStudentPin')?.value || '';
        if(!pin){ state.loginError = 'Please enter your PIN.'; renderLogin(); return; }
        const hash = await hashPin(pin);
        if(hash !== s.pinHash){ state.loginError = 'Incorrect PIN.'; renderLogin(); return; }
      } else {
        const pin = document.getElementById('firstTimeStudentPin')?.value || '';
        const pinConfirm = document.getElementById('firstTimeStudentPinConfirm')?.value || '';
        if(pin.length < 4){ state.loginError = 'PIN must be at least 4 characters.'; renderLogin(); return; }
        if(pin !== pinConfirm){ state.loginError = 'PINs do not match.'; renderLogin(); return; }
        s.pinHash = await hashPin(pin);
      }
      if(!s.email){
        const email = (document.getElementById('studentEmailBackfill')?.value || '').trim();
        if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
        s.email = email;
      }
      await saveCollection('students', state.students);
      state.identity = { role:'student', id:s.id, name:s.name };
      showApp();
    } else {
      state.loginError = 'Please select who you are, or add yourself as a new student.';
      renderLogin();
    }
  } else if(state.loginRole === 'cosupervisor'){
    if(!state.loginPickId){
      state.loginError = 'Please select who you are.';
      renderLogin();
      return;
    }
    const c = state.coSupervisors.find(x=>x.id===state.loginPickId);
    if(!c){ state.loginError = 'That account could not be found.'; renderLogin(); return; }
    if(c.pinHash){
      const pin = document.getElementById('existingCoSupPin')?.value || '';
      if(!pin){ state.loginError = 'Please enter your PIN.'; renderLogin(); return; }
      const hash = await hashPin(pin);
      if(hash !== c.pinHash){ state.loginError = 'Incorrect PIN.'; renderLogin(); return; }
    } else {
      const pin = document.getElementById('firstTimeCoSupPin')?.value || '';
      const pinConfirm = document.getElementById('firstTimeCoSupPinConfirm')?.value || '';
      if(pin.length < 4){ state.loginError = 'PIN must be at least 4 characters.'; renderLogin(); return; }
      if(pin !== pinConfirm){ state.loginError = 'PINs do not match.'; renderLogin(); return; }
      c.pinHash = await hashPin(pin);
    }
    if(!c.email){
      const email = (document.getElementById('coSupEmailBackfill')?.value || '').trim();
      if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
      c.email = email;
    }
    await saveCollection('co-supervisors', state.coSupervisors);
    state.identity = { role:'cosupervisor', id:c.id, name:c.name };
    showApp();
  } else {
    state.loginError = 'Please choose whether you are the supervisor, a co-supervisor, or a student.';
    renderLogin();
  }
}

function scopedList(arr){
  if(state.identity.role === 'student') return arr.filter(x => x.studentId === state.identity.id);
  if(state.identity.role === 'cosupervisor'){
    const ids = assignedStudentIds();
    const base = arr.filter(x => ids.includes(x.studentId));
    if(state.filterStudentId === 'all') return base;
    return base.filter(x => x.studentId === state.filterStudentId);
  }
  if(state.filterStudentId === 'all') return arr;
  return arr.filter(x => x.studentId === state.filterStudentId);
}

async function submitInstruction(){

async function deleteInstruction(id){

function viewOverview(){
  const weekly = scopedList(state.weekly);
  const samples = scopedList(state.samples);
  const papers = scopedList(state.papers);
  const meetings = scopedList(state.meetings);

  const pendingReports = weekly.filter(w=>w.status==='pending').length;
  const pendingSamples = samples.filter(s=>s.approvalStatus==='pending').length;
  const pendingPapers = papers.filter(p=>!!p.pendingStage).length;
  const pendingMeetings = meetings.filter(m=>m.status==='proposed').length;
  const totalPendingApproval = pendingReports + pendingSamples + pendingPapers + pendingMeetings;
  const awaitingSamples = samples.filter(s=>!s.resultsReceivedDate).length;
  const overdueSamples = samples.filter(s=> !s.resultsReceivedDate && s.expectedDate && s.expectedDate < todayStr()).length;
  const activePapers = papers.filter(p=>p.stage!=='Published').length;
  const publishedPapers = papers.filter(p=>p.stage==='Published').length;

  const upcoming = meetings.filter(m=> (m.status==='proposed'||m.status==='confirmed') && m.plannedDate >= todayStr())
    .sort((a,b)=> a.plannedDate.localeCompare(b.plannedDate)).slice(0,5);

  const feed = [
    ...weekly.map(w=>({ type:'Weekly', date:w.weekStart, text:`<b>${escapeHtml(studentName(w.studentId))}</b> logged progress — week of ${fmtDate(w.weekStart)}` , sortDate:w.weekStart})),
    ...samples.map(s=>({ type:'Sample', date:s.submittedDate, text:`<b>${escapeHtml(studentName(s.studentId))}</b> submitted <b>${escapeHtml(s.sampleName)}</b> (${escapeHtml(s.technique)})${s.resultsReceivedDate? ' — results in':''}`, sortDate: s.resultsReceivedDate || s.submittedDate})),
    ...papers.map(p=>({ type:'Paper', date:p.lastUpdate, text:`<b>${escapeHtml(studentName(p.studentId))}</b> — "${escapeHtml(p.title)}" is <b>${escapeHtml(p.stage)}</b>${p.pendingStage ? ` (proposed: ${escapeHtml(p.pendingStage)})` : ''}`, sortDate:p.lastUpdate })),
    ...meetings.map(m=>({ type:'Meeting', date:m.lastUpdate, text:`<b>${escapeHtml(studentName(m.studentId))}</b> — ${escapeHtml(m.type)}: "${escapeHtml(m.title)}" (${m.status})`, sortDate:m.lastUpdate }))
  ].filter(f=>f.sortDate).sort((a,b)=> b.sortDate.localeCompare(a.sortDate)).slice(0,8);

  const roleTitle = { supervisor:'Group Overview', cosupervisor:'My Assigned Students', student:'My Overview' }[state.identity.role];
  const roleSub = { supervisor:'Everything here is final only once you approve it.', cosupervisor:'A view of the students assigned to you — everything here is final only once approved.', student:'A snapshot of your progress, samples, and papers.' }[state.identity.role];

  return `
    ${supervisorFilterBar()}
    <div class="view-header" style="margin-bottom:14px; padding-bottom:12px;">
      <div>
        <div class="view-title">${roleTitle}</div>
        <div class="view-sub">${roleSub}</div>
      </div>
    </div>
    <div class="stat-grid compact">
      ${isSupervisorLike()
        ? `<div class="stat-card compact accent-blue ${totalPendingApproval>0?'warn':'ok'}"><div class="stat-num">${totalPendingApproval}</div><div class="stat-label"><span class="dot"></span>Awaiting approval</div></div>`
        : `<div class="stat-card compact accent-blue ${pendingReports>0?'warn':''}"><div class="stat-num">${pendingReports}</div><div class="stat-label"><span class="dot"></span>Reports pending</div></div>`}
      <div class="stat-card compact accent-teal ${overdueSamples>0?'warn':'ok'}"><div class="stat-num">${awaitingSamples}</div><div class="stat-label"><span class="dot"></span>Awaiting results</div></div>
      <div class="stat-card compact ${overdueSamples>0?'warn':''}"><div class="stat-num">${overdueSamples}</div><div class="stat-label"><span class="dot" style="background:var(--danger);"></span>Overdue</div></div>
      <div class="stat-card compact accent-purple"><div class="stat-num">${activePapers}</div><div class="stat-label"><span class="dot"></span>Papers active</div></div>
      <div class="stat-card compact ok"><div class="stat-num">${publishedPapers}</div><div class="stat-label"><span class="dot"></span>Published</div></div>
      <div class="stat-card compact accent-indigo"><div class="stat-num">${upcoming.length}</div><div class="stat-label"><span class="dot"></span>Upcoming meetings</div></div>
    </div>

    ${isSupervisorLike() ? studentSummaryTable() : ''}

    <div class="two-col-panels">
      <div>
        <h3 class="panel-title"><span class="dot" style="background:var(--navy);"></span>Recent activity</h3>
        <div class="entry-card compact-card">
          ${feed.length===0 ? `<div class="empty-state"><div class="em-title">The logbook is empty</div><div class="em-sub">Once progress, samples, or papers are logged, they'll show up here.</div></div>` :
            feed.map((f,i)=>`
              <div class="feed-item compact">
                <div class="feed-idx">${String(i+1).padStart(2,'0')}</div>
                <div class="feed-body">${f.text} <span class="feed-date">· ${fmtDate(f.date)}</span></div>
              </div>`).join('')}

      </div>
      <div>
        <h3 class="panel-title"><span class="dot" style="background:var(--stat-indigo);"></span>Upcoming meetings</h3>
        <div class="entry-card compact-card">
          ${upcoming.length===0 ? `<div class="empty-state"><div class="em-title">Nothing scheduled</div><div class="em-sub">Planned reviews and presentations will show up here.</div></div>` :

                <div class="feed-body"><b>${escapeHtml(studentName(m.studentId))}</b> — ${escapeHtml(m.type)}: ${escapeHtml(m.title)} <span class="feed-date">· ${m.status}</span></div>

    </div>
  `;
}
function downloadBackup(){
  const role = state.identity.role;
  const isSupervisor = role === 'supervisor';
  const visible = visibleStudentsForIdentity();
  const scope = isSupervisor ? 'full-group' : role === 'cosupervisor' ? 'assigned-students-only' : 'own-records-only';
  const data = {
    exportedAt: new Date().toISOString(),
    exportedBy: state.identity.name,
    scope,
    students: visible.map(s=>({id:s.id, name:s.name, email:s.email||''})),
    weeklyReports: scopedList(state.weekly),
    samples: scopedList(state.samples),
    papers: scopedList(state.papers)
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `logbook-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function handleRestoreFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert('That file is not valid JSON.'); return; }
    if(!Array.isArray(parsed.weeklyReports) || !Array.isArray(parsed.samples) || !Array.isArray(parsed.papers) || !Array.isArray(parsed.students)){
      alert("This file doesn't look like a logbook backup — missing expected fields.");
      return;
    }
    if(!confirm(`This will replace the group's current data with the contents of "${file.name}". This cannot be undone. Continue?`)) return;
    state.students = parsed.students.map(s => {
      const existing = state.students.find(x=>x.id===s.id);
      return { ...s, pinHash: existing?.pinHash || s.pinHash || null, email: s.email || existing?.email || '' };
    });
    state.weekly = parsed.weeklyReports;
    state.samples = parsed.samples;
    state.papers = parsed.papers;
    await Promise.all([
      saveCollection('students', state.students),
      saveCollection('weekly-reports', state.weekly),
      saveCollection('samples', state.samples),
      saveCollection('papers', state.papers)
    ]);
    event.target.value = '';
    alert('Restore complete.');
    renderView();
  };
  reader.readAsText(file);
}

/* ============================ PAPERS ============================ */
function stageStampClass(stage){
  if(stage==='Published') return 'good';
  if(stage==='Accepted') return 'good';
  if(stage==='Revisions Requested') return 'warn';
  if(stage==='Under Review' || stage==='Submitted') return 'neutral';
  return 'neutral';
}
function viewPapers(){
  let list = scopedList(state.papers).slice().sort((a,b)=> (b.lastUpdate||'').localeCompare(a.lastUpdate||''));
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Paper Pipeline</div>
        <div class="view-sub">Track manuscripts from planning through to publication, with draft and reference links.</div>
      </div>
      <button class="action-btn" onclick="openPaperModal()">+ Add paper</button>
    </div>
    ${supervisorFilterBar()}
    ${list.length===0 ? emptyState('No papers tracked yet', 'Add a paper to start tracking its progress toward publication.') : list.map((p,i)=>paperCard(p,i,list.length)).join('')}
  `;
}
function paperCard(p, i, total){
  const isOwner = state.identity.role==='student' && p.studentId===state.identity.id;
  const canManage = isSupervisorLike();
  const locked = p.stage === 'Published' && isOwner;
  const canEdit = canManage || (isOwner && !locked);
  const hasPending = !!p.pendingStage;
  const refLinks = p.referenceLinks || [];
  return `
    <div class="entry-card">
      <div class="entry-top">
        <div>
          <div class="entry-idx">P${String(total-i).padStart(2,'0')} · ${escapeHtml(studentName(p.studentId))}</div>
          <div class="entry-title">${escapeHtml(p.title)}</div>
          <div class="entry-meta">${escapeHtml(p.targetJournal || 'Target journal not set')}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="stamp ${stageStampClass(p.stage)}">${escapeHtml(p.stage)}</span>
          ${hasPending ? `<span class="stamp warn">Proposed: ${escapeHtml(p.pendingStage)}</span>` : ''}
        </div>
      </div>
      ${p.notes ? `<div class="entry-block"><span class="lbl">Notes</span>${nl2br(p.notes)}</div>` : ''}
      ${p.manuscriptLink ? `<div class="entry-block" style="margin-top:8px;"><span class="lbl">Manuscript / draft</span><a href="${escapeHtml(p.manuscriptLink)}" target="_blank" rel="noopener">Open draft ↗</a></div>` : ''}
      <div class="entry-block" style="margin-top:8px;">
        <span class="lbl">Reference links <span style="text-transform:none; font-weight:400;">(reading, citations, related work)</span></span>
        ${refLinks.length===0 ? `<span class="entry-meta">No reference links added yet.</span>` : `
          <ul style="margin:4px 0 0; padding-left:18px;">
            ${refLinks.map(l=>`
              <li style="margin-bottom:3px; font-size:13.5px;">
                <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label || l.url)}</a>
                ${canEdit ? `<button class="small-btn" style="padding:1px 7px; font-size:11px; margin-left:6px;" onclick="deleteReferenceLink('${p.id}','${l.id}')">Remove</button>` : ''}
              </li>
            `).join('')}
          </ul>
        `}
      </div>
      ${p.supervisorNote ? `<div class="comment-box"><span class="lbl">Supervisor note</span><div class="comment-existing">${nl2br(p.supervisorNote)}</div></div>` : ''}
      <div class="entry-meta" style="margin-top:8px;">Last updated ${fmtDate(p.lastUpdate)}</div>
      ${locked ? `<div class="entry-meta" style="margin-top:6px;">Published papers are locked — contact your supervisor for any changes.</div>` : ''}
      ${hasPending ? `
        <div class="entry-actions">
          ${canManage ? `
            <button class="small-btn" onclick="approvePendingStage('${p.id}')">Approve → ${escapeHtml(p.pendingStage)}</button>
            <button class="small-btn danger" onclick="rejectPendingStage('${p.id}')">Reject</button>
          ` : `<div class="entry-meta">Waiting on supervisor approval to move to <b>${escapeHtml(p.pendingStage)}</b>.</div>`}
        </div>
      ` : ''}
      <div class="entry-actions">
        ${canEdit && !hasPending ? `
          <select class="small-btn" style="padding-right:6px;" onchange="requestStageChange('${p.id}', this.value)">
            ${PAPER_STAGES.map(s=>`<option value="${s}" ${p.stage===s?'selected':''}>${s}</option>`).join('')}
          </select>
        ` : ''}
        ${canEdit ? `<button class="small-btn" onclick="openEditPaperDetails('${p.id}')">Edit details</button>` : ''}
        ${canEdit ? `<button class="small-btn" onclick="openAddReferenceLinkModal('${p.id}')">+ Add reference link</button>` : ''}
        ${canEdit ? `<button class="small-btn danger" onclick="deletePaper('${p.id}')">Delete</button>` : ''}
      </div>
    </div>
  `;
}

  showModal('Add paper to pipeline', `

  `, submitPaper);

async function submitPaper(){
  const title = document.getElementById('f_title').value.trim();
  const targetJournal = document.getElementById('f_journal').value.trim();
  const manuscriptLink = document.getElementById('f_manuscriptLink').value.trim();
  const notes = document.getElementById('f_paperNotes').value.trim();
  if(!title){ alert('Please add a title.'); return; }
  const studentId = state.identity.role==='student' ? state.identity.id : (state.filterStudentId!=='all' ? state.filterStudentId : visibleStudentsForIdentity()[0]?.id);
  if(!studentId){ alert('Add a student first.'); return; }
  state.papers.push({
    id: uid('pap'), studentId, title, targetJournal, manuscriptLink, referenceLinks: [], stage: 'Planning', pendingStage: null,
    notes, supervisorNote:'', lastUpdate: todayStr()
  });

async function requestStageChange(id, newStage){
  const p = state.papers.find(x=>x.id===id);
  if(newStage === p.stage) return;
  if(isSupervisorLike()){
    // Supervisor/co-supervisor changes are final immediately — no approval needed on their own call.
    p.stage = newStage;
    p.pendingStage = null;
    p.lastUpdate = todayStr();
    await saveCollection('papers', state.papers);
  } else {
    // Student proposals wait for supervisor approval before they become official.
    p.pendingStage = newStage;
    p.lastUpdate = todayStr();
    await saveCollection('papers', state.papers);
    apiNotify('paperStageProposed', { studentId: p.studentId, title: p.title, proposedStage: newStage });
  }
  renderView();
}
async function approvePendingStage(id){
  const p = state.papers.find(x=>x.id===id);
  p.stage = p.pendingStage;
  p.pendingStage = null;
  p.lastUpdate = todayStr();
  await saveCollection('papers', state.papers);
  apiNotify('paperStageDecided', { studentId: p.studentId, title: p.title, decision:'approved', stage: p.stage });
  renderView();
}
async function rejectPendingStage(id){
  const p = state.papers.find(x=>x.id===id);
  const note = prompt(`Optional note to ${studentName(p.studentId)} on why this stage change was rejected:`, '');
  if(note === null) return;
  p.supervisorNote = note.trim();
  p.pendingStage = null;
  await saveCollection('papers', state.papers);
  apiNotify('paperStageDecided', { studentId: p.studentId, title: p.title, decision:'rejected', note: note.trim() });
  renderView();
}

      visible.map(s=>`<option value="${s.id}" ${state.reportStudentId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')
    : `<option value="${state.identity.id}" selected>${escapeHtml(state.identity.name)}</option>`;

  return `

          </select>
        </div>
        <div></div>
        <div><label class="field-label">From (optional)</label>
          <input type="date" class="text-input" id="r_from" value="${state.reportFrom}" onchange="state.reportFrom=this.value">
        </div>

      </div>
    </div>
    <div id="reportPrintArea">${state.reportData ? renderReportHtml(state.reportData) : ''}</div>
  `;
}

function inRange(dateStr, from, to){
  if(!dateStr) return !from && !to ? true : false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

function buildReportForStudent(studentId, from, to){
  const instructions = state.instructions.filter(x=>x.studentId===studentId && inRange(x.date, from, to)).sort((a,b)=>a.date.localeCompare(b.date));
  const weekly = state.weekly.filter(x=>x.studentId===studentId && inRange(x.weekStart, from, to)).sort((a,b)=>a.weekStart.localeCompare(b.weekStart));
  const samples = state.samples.filter(x=>x.studentId===studentId && inRange(x.submittedDate, from, to)).sort((a,b)=>a.submittedDate.localeCompare(b.submittedDate));
  const papers = state.papers.filter(x=>x.studentId===studentId && inRange(x.lastUpdate, from, to)).sort((a,b)=>(a.lastUpdate||'').localeCompare(b.lastUpdate||''));
  const meetings = state.meetings.filter(x=>x.studentId===studentId && inRange(x.plannedDate, from, to)).sort((a,b)=>(a.plannedDate||'').localeCompare(b.plannedDate||''));
  return { studentId, name: studentName(studentId), instructions, weekly, samples, papers, meetings };
}

function generateReport(){
  const from = state.reportFrom, to = state.reportTo;
  const studentIds = state.reportStudentId==='all' ? visibleStudentsForIdentity().map(s=>s.id) : [state.reportStudentId];
  if(studentIds.length===0){ alert('No students to report on yet.'); return; }
  state.reportData = {
    generatedAt: todayStr(), from, to,
    students: studentIds.map(id=>buildReportForStudent(id, from, to))
  };
  renderView();
  setTimeout(()=>{ document.getElementById('reportPrintArea')?.scrollIntoView({behavior:'smooth'}); }, 50);
}

function renderReportHtml(data){
  const periodLabel = (data.from || data.to) ? `${data.from ? fmtDate(data.from) : 'Start'} — ${data.to ? fmtDate(data.to) : 'Present'}` : 'All time';
  return `
    <div class="report-doc">
      <div class="report-head">
        <div class="report-eyebrow">Research Group Management System — Progress Report</div>
        <div class="report-meta">Generated ${fmtDate(data.generatedAt)} · Period: ${escapeHtml(periodLabel)}</div>
      </div>
      ${data.students.map(s=>renderStudentReportSection(s)).join('<div class="report-divider"></div>')}
    </div>
  `;
}

  const weeklyStatusLabel = { pending:'Pending Approval', approved:'Approved', changes_requested:'Changes Requested' };
  return `

          <thead><tr><th>Date</th><th>Instruction</th><th>Logged by</th></tr></thead>
          <tbody>
            ${s.instructions.map(ins=>`<tr><td>${fmtDate(ins.date)}</td><td>${nl2br(ins.text)}</td><td>${escapeHtml(ins.addedByName)}</td></tr>`).join('')}
          </tbody>
        </table>
      `}

      <h3 class="report-section-title">Weekly Progress Log</h3>
      ${s.weekly.length===0 ? `<p class="report-empty">No weekly progress logged for this period.</p>` : s.weekly.map(w=>`
        <div class="report-entry">
          <div class="report-entry-head"><b>Week of ${fmtDate(w.weekStart)}</b><span>${weeklyStatusLabel[w.status]||w.status}</span></div>

          <p><b>Plan for next week:</b> ${nl2br(w.planNext) || '—'}</p>
          ${w.challenges ? `<p><b>Challenges:</b> ${nl2br(w.challenges)}</p>` : ''}
          ${w.supervisorComment ? `<p><b>Supervisor feedback:</b> ${nl2br(w.supervisorComment)}</p>` : ''}
        </div>
      `).join('')}

      <h3 class="report-section-title">Characterization Samples Log</h3>
      ${s.samples.length===0 ? `<p class="report-empty">No samples logged for this period.</p>` : `
        <table class="report-table">
          <thead><tr><th>Sample</th><th>Technique</th><th>Submitted</th><th>Results received</th><th>Status</th><th>Supervisor note</th></tr></thead>
          <tbody>
            ${s.samples.map(sm=>`<tr><td>${escapeHtml(sm.sampleName)}</td><td>${escapeHtml(sm.technique)}</td><td>${fmtDate(sm.submittedDate)}</td><td>${sm.resultsReceivedDate?fmtDate(sm.resultsReceivedDate):'—'}</td><td>${sm.approvalStatus==='approved'?'Approved':sm.approvalStatus==='changes_requested'?'Changes Requested':'Pending Approval'}</td><td>${nl2br(sm.supervisorNote)||'—'}</td></tr>`).join('')}
          </tbody>
        </table>
      `}

      <h3 class="report-section-title">Paper Pipeline Log</h3>
      ${s.papers.length===0 ? `<p class="report-empty">No papers logged for this period.</p>` : `
        <table class="report-table">
          <thead><tr><th>Title</th><th>Target journal</th><th>Stage</th><th>Last updated</th><th>Supervisor note</th></tr></thead>
          <tbody>
            ${s.papers.map(p=>`<tr><td>${escapeHtml(p.title)}</td><td>${escapeHtml(p.targetJournal)||'—'}</td><td>${escapeHtml(p.stage)}${p.pendingStage?` (proposed: ${escapeHtml(p.pendingStage)})`:''}</td><td>${fmtDate(p.lastUpdate)}</td><td>${nl2br(p.supervisorNote)||'—'}</td></tr>`).join('')}
          </tbody>
        </table>
      `}

      <h3 class="report-section-title">Meetings Log</h3>
      ${s.meetings.length===0 ? `<p class="report-empty">No meetings or presentations logged for this period.</p>` : `
        <table class="report-table">
          <thead><tr><th>Date</th><th>Type</th><th>Title</th><th>Status</th><th>Notes</th></tr></thead>
          <tbody>
            ${s.meetings.map(m=>`<tr><td>${fmtDate(m.plannedDate)}</td><td>${escapeHtml(m.type)}</td><td>${escapeHtml(m.title)}</td><td>${(MEETING_STATUS[m.status]||{label:m.status}).label}</td><td>${nl2br(m.outcomeNotes || m.agenda)||'—'}</td></tr>`).join('')}
          </tbody>
        </table>
      `}
    </div>
  `;
}

function downloadReportText(){
  const data = state.reportData;
  if(!data) return;
  const periodLabel = (data.from || data.to) ? `${data.from ? fmtDate(data.from) : 'Start'} - ${data.to ? fmtDate(data.to) : 'Present'}` : 'All time';
  let out = `RESEARCH GROUP LOGBOOK — PROGRESS REPORT\nGenerated ${fmtDate(data.generatedAt)}\nPeriod: ${periodLabel}\n`;
  data.students.forEach(s=>{
    out += `\n${'='.repeat(60)}\n${s.name}\n${'='.repeat(60)}\n`;
    out += `\n-- Supervisor Instructions Log --\n`;
    if(s.instructions.length===0) out += `(none logged for this period)\n`;
    s.instructions.forEach(ins=>{ out += `[${fmtDate(ins.date)}] (logged by ${ins.addedByName})\n${ins.text}\n\n`; });
    out += `\n-- Weekly Progress Log --\n`;
    if(s.weekly.length===0) out += `(none logged for this period)\n`;
    s.weekly.forEach(w=>{
      out += `[Week of ${fmtDate(w.weekStart)}] Status: ${w.status}\nWork done: ${w.workDone}\nPlan for next week: ${w.planNext}\n`;
      if(w.challenges) out += `Challenges: ${w.challenges}\n`;
      if(w.supervisorComment) out += `Supervisor feedback: ${w.supervisorComment}\n`;
      out += `\n`;
    });
    out += `\n-- Characterization Samples Log --\n`;
    if(s.samples.length===0) out += `(none logged for this period)\n`;
    s.samples.forEach(sm=>{
      out += `${sm.sampleName} — ${sm.technique} | Submitted: ${fmtDate(sm.submittedDate)} | Results: ${sm.resultsReceivedDate?fmtDate(sm.resultsReceivedDate):'pending'} | ${sm.approvalStatus}\n`;
      if(sm.supervisorNote) out += `  Supervisor note: ${sm.supervisorNote}\n`;
    });
    out += `\n-- Paper Pipeline Log --\n`;
    if(s.papers.length===0) out += `(none logged for this period)\n`;
    s.papers.forEach(p=>{
      out += `${p.title} | Journal: ${p.targetJournal||'—'} | Stage: ${p.stage}${p.pendingStage?` (proposed: ${p.pendingStage})`:''} | Updated: ${fmtDate(p.lastUpdate)}\n`;
      if(p.supervisorNote) out += `  Supervisor note: ${p.supervisorNote}\n`;
    });
    out += `\n-- Meetings Log --\n`;
    if(s.meetings.length===0) out += `(none logged for this period)\n`;
    s.meetings.forEach(m=>{
      out += `[${fmtDate(m.plannedDate)}] ${m.type}: ${m.title} | Status: ${(MEETING_STATUS[m.status]||{label:m.status}).label}\n`;
      if(m.agenda) out += `  Agenda: ${m.agenda}\n`;
      if(m.outcomeNotes) out += `  Notes: ${m.outcomeNotes}\n`;
    });
  });
  const blob = new Blob([out], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `progress-report-${todayStr()}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================ MODAL ============================ */
function showModal(title, bodyHtml, onSubmit){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          ${bodyHtml}
          <div class="modal-foot">
            <button class="small-btn" onclick="closeModal()">Cancel</button>
            <button class="action-btn" id="modalSubmitBtn">Save</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalSubmitBtn').onclick = onSubmit;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ============================ START ============================ */
init();
</script>
