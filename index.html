<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Devices and Materials Group — Research Logbook</title>
<meta name="description" content="Weekly progress, characterization tracking, and paper pipeline management for research groups.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RG Logbook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F7;
    --surface:#FFFFFF;
    --border:#E1E4EA;
    --border-strong:#CBD1DB;
    --ink:#151B29;
    --ink-soft:#5C6478;
    --ink-faint:#8A90A2;
    --navy:#1F3A5F;
    --navy-dark:#152A46;
    --navy-wash:#E9EEF5;
    --success:#166A4C;
    --success-wash:#E4F4EC;
    --warning:#8A5A0B;
    --warning-wash:#FBF0DD;
    --danger:#A32A24;
    --danger-wash:#FBEAE9;
    --neutral-wash:#EEF0F3;
    --stat-blue:#2B5FA8;
    --stat-blue-wash:#E7EEF8;
    --stat-purple:#6E4A9E;
    --stat-purple-wash:#EFE7F5;
    --stat-teal:#0E7C86;
    --stat-teal-wash:#E1F2F1;
    --stat-indigo:#4A54A8;
    --stat-indigo-wash:#ECEDF7;
    --stat-cyan:#1287A8;
    --stat-cyan-wash:#E2F1F5;
    --stat-rose:#B5476B;
    --stat-rose-wash:#F6E7ED;
    --shadow-sm: 0 1px 2px rgba(21,27,41,0.05);
    --shadow-md: 0 2px 6px rgba(21,27,41,0.06), 0 8px 24px rgba(21,27,41,0.05);
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Roboto', sans-serif;
    font-size:15.5px;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Roboto', sans-serif; letter-spacing:-0.005em; }
  .heading{ font-family:'Roboto', sans-serif; letter-spacing:-0.005em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  /* Vertical scrolling box, sized so roughly 10 items are visible at once
     (10 rows × ~34px) before the box itself takes over scrolling for the
     rest — a plain scrollable list rather than an auto-animating marquee,
     since links need to be readable and clickable, not flying past. */
  .news-ticker{ width:100%; height:340px; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:0; }
  .news-ticker.compact{ height:auto; max-height:340px; }
  .news-ticker-track{ display:flex; flex-direction:column; }
  .news-ticker-track.animated{ animation: newsTickerScrollUp linear infinite; }
  .news-ticker:hover .news-ticker-track.animated{ animation-play-state:paused; }
  @keyframes newsTickerScrollUp{ from{ transform:translateY(0); } to{ transform:translateY(-50%); } }
  .news-ticker-item{ display:block; padding:9px 18px; color:var(--ink); font-size:13.5px; border-bottom:1px solid var(--border); }
  .news-ticker-item:last-child{ border-bottom:none; }
  button{ font-family:'Roboto', sans-serif; cursor:pointer; }
  input,select,textarea{ font-family:'Roboto', sans-serif; }
  ::selection{ background:var(--navy-wash); }
  a{ color:var(--navy); }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:stretch; justify-content:center; padding:0;
    background-color:var(--bg);
    background-image: radial-gradient(circle, rgba(31,58,95,0.05) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .login-hero{
    flex:1 1 380px; max-width:460px; color:#fff; padding:56px 48px; display:flex; flex-direction:column;
    justify-content:center; position:relative; overflow:hidden;
    background-color:var(--navy);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px),
      linear-gradient(155deg, var(--navy) 0%, var(--navy-dark) 100%);
    background-size: 22px 22px, auto;
  }
  .login-hero:before{ content:""; position:absolute; width:340px; height:340px; border-radius:50%; background:rgba(255,255,255,0.05); top:-120px; right:-120px; }
  .login-hero:after{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,0.04); bottom:-90px; left:-70px; }
  .login-hero-illustration{ position:absolute; right:-6px; bottom:14px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; opacity:0.55; pointer-events:none; }
  .login-hero-mark{ width:44px; height:44px; border-radius:10px; background:#fff; color:var(--navy-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; margin-bottom:24px; position:relative; z-index:1; }
  .login-hero-title{ font-family:'Roboto', sans-serif; font-size:31px; font-weight:600; line-height:1.25; letter-spacing:-0.01em; margin-bottom:0; position:relative; z-index:1; }
  .login-hero-groupname{ font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,0.6); margin-bottom:22px; position:relative; z-index:1; }
  .login-hero-tag{ font-size:14px; line-height:1.65; color:rgba(255,255,255,0.72); max-width:360px; margin-bottom:28px; position:relative; z-index:1; }
  .login-hero-list{ list-style:none; padding:0; margin:0 0 32px; display:flex; flex-direction:column; gap:11px; position:relative; z-index:1; }
  .login-hero-list li{ font-size:13.5px; color:rgba(255,255,255,0.92); padding-left:24px; position:relative; }
  .login-hero-list li:before{ content:"✓"; position:absolute; left:0; top:0; color:#8FD6C4; font-weight:700; }
  .login-hero-foot{ font-size:11px; color:rgba(255,255,255,0.38); letter-spacing:.06em; text-transform:uppercase; position:relative; z-index:1; }
  .login-card-wrap{ flex:1 1 480px; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
  @keyframes loginFadeIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .login-card{
    width:100%; max-width:600px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow-md); padding:40px 36px;
    animation: loginFadeIn .4s cubic-bezier(.2,.7,.3,1);
  }
  @media (max-width: 860px){
    .login-hero{ display:none; }
    .login-card-wrap{ flex:1 1 100%; padding:24px 18px; }
  }
  .login-mark{ width:38px; height:38px; border-radius:8px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; letter-spacing:0.02em; margin-bottom:18px; }
  .login-eyebrow{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; }
  .login-title{ font-family:'Roboto', sans-serif; font-size:27px; font-weight:600; margin:6px 0 6px; letter-spacing:-0.01em; }
  .login-sub{ color:var(--ink-soft); font-size:15px; margin-bottom:28px; line-height:1.6; }
  .role-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .role-row .role-btn{ flex:1 1 140px; }
  .role-btn{
    flex:1; padding:14px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    font-weight:600; font-size:14px; color:var(--ink-soft); transition:all .12s ease; text-align:center;
  }
  .role-btn small{ display:block; font-weight:400; font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .role-btn.active{ border-color:var(--navy); background:var(--navy-wash); color:var(--navy-dark); box-shadow:inset 0 0 0 1px var(--navy); }
  .field-label{ font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px; display:block; }
  .text-input, select.text-input, textarea.text-input{
    width:100%; padding:11px 13px; border:1px solid var(--border-strong); border-radius:7px; font-size:14.5px; color:var(--ink); background:var(--surface);
  }
  .text-input:focus, select:focus, textarea:focus{ outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy); }
  .student-pick-list{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:8px; }
  .pick-chip{ padding:7px 13px; border-radius:20px; border:1px solid var(--border-strong); background:var(--surface); font-size:13px; font-weight:500; color:var(--ink-soft); }
  .pick-chip.active{ border-color:var(--navy); background:var(--navy); color:#fff; }
  .primary-btn{
    width:100%; margin-top:24px; padding:13px; background:var(--navy); color:#fff; border:none; border-radius:7px;
    font-weight:600; font-size:14.5px; letter-spacing:.01em; transition:background .12s;
  }
  .primary-btn:hover{ background:var(--navy-dark); }
  .primary-btn:disabled{ background:var(--border-strong); cursor:not-allowed; }

  /* ---------- App shell ---------- */
  #appShell{ display:none; min-height:100vh; }
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; background:var(--navy-dark); border-bottom:1px solid var(--navy-dark);
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{ width:30px; height:30px; border-radius:7px; background:#fff; color:var(--navy-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .brand-name{ font-family:'Roboto', sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.005em; color:#fff; line-height:1.2; }
  .brand-subtitle{ font-size:11px; font-weight:500; letter-spacing:.03em; color:rgba(255,255,255,0.55); margin-top:1px; }
  .identity-pill{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .identity-badge{ font-size:13.5px; padding:6px 13px; border-radius:20px; background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.14); }
  .identity-badge b{ font-weight:600; }
  .switch-link{ font-size:12.5px; color:rgba(255,255,255,0.65); background:none; border:none; text-decoration:none; padding:4px; font-weight:500; }
  .switch-link:hover{ color:#fff; text-decoration:underline; }

  .layout{ display:flex; align-items:flex-start; }
  .sidebar{ width:212px; flex-shrink:0; padding:14px 10px; position:sticky; top:57px; align-self:flex-start; background:var(--surface); border-right:1px solid var(--border); }
  .nav-group-label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:10px 8px 3px; }
  .nav-group-label:first-child{ margin-top:0; }
  .nav-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:6px 9px; border-radius:6px;
    border:none; background:none; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:1px;
  }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--border-strong); flex-shrink:0; }
  .nav-item.active{ background:var(--navy-wash); color:var(--navy-dark); font-weight:600; }
  .nav-item:hover:not(.active){ background:var(--neutral-wash); }

  main#main{ flex:1; padding:28px 34px 64px; min-width:0; }
  .view-header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--border); }
  .view-title{ font-family:'Roboto', sans-serif; font-size:24px; font-weight:600; letter-spacing:-0.01em; }
  .view-sub{ color:var(--ink-soft); font-size:14.5px; margin-top:4px; }
  .action-btn{
    padding:10px 17px; background:var(--navy); color:#fff; border:none; border-radius:7px; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; gap:6px; transition:background .12s;
  }
  .action-btn:hover{ background:var(--navy-dark); }
  .action-btn.ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--border-strong); }
  .action-btn.ghost:hover{ background:var(--neutral-wash); }

  .filter-row{ display:flex; gap:8px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .filter-row select{ padding:8px 11px; border-radius:7px; border:1px solid var(--border-strong); font-size:13px; background:var(--surface); color:var(--ink); }

  /* ---------- Dashboard cards ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(168px,1fr)); gap:14px; margin-bottom:30px; }
  .stat-grid.compact{ grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--border-strong); border-radius:var(--radius); padding:17px 19px; box-shadow:var(--shadow-sm); transition:box-shadow .15s, transform .15s; }
  .stat-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .stat-card.compact{ padding:14px 16px; }
  .stat-card.compact .stat-num{ font-size:25px; }
  .stat-card.compact .stat-label{ font-size:11px; margin-top:2px; }
  .stat-num{ font-size:30px; font-weight:700; letter-spacing:-0.02em; color:var(--ink); }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:3px; font-weight:500; display:flex; align-items:center; gap:6px; }
  .stat-label .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 3px rgba(0,0,0,0.04); }
  /* Category accents — tinted background + colored number, applied first so urgency (warn/ok) can override below */
  .stat-card.accent-blue{ background:linear-gradient(180deg, var(--stat-blue-wash) 0%, var(--surface) 100%); border-top-color:var(--stat-blue); }
  .stat-card.accent-blue .stat-num{ color:var(--stat-blue); }
  .stat-card.accent-blue .dot{ background:var(--stat-blue); }
  .stat-card.accent-purple{ background:linear-gradient(180deg, var(--stat-purple-wash) 0%, var(--surface) 100%); border-top-color:var(--stat-purple); }
  .stat-card.accent-purple .stat-num{ color:var(--stat-purple); }
  .stat-card.accent-purple .dot{ background:var(--stat-purple); }
  .stat-card.accent-teal{ background:linear-gradient(180deg, var(--stat-teal-wash) 0%, var(--surface) 100%); border-top-color:var(--stat-teal); }
  .stat-card.accent-teal .stat-num{ color:var(--stat-teal); }
  .stat-card.accent-teal .dot{ background:var(--stat-teal); }
  .stat-card.accent-indigo{ background:linear-gradient(180deg, var(--stat-indigo-wash) 0%, var(--surface) 100%); border-top-color:var(--stat-indigo); }
  .stat-card.accent-indigo .stat-num{ color:var(--stat-indigo); }
  .stat-card.accent-indigo .dot{ background:var(--stat-indigo); }
  /* Urgency state — wins over category tint when both are present (defined after accents on purpose) */
  .stat-card.warn{ background:linear-gradient(180deg, var(--danger-wash) 0%, var(--surface) 100%); border-top-color:var(--danger); }
  .stat-card.warn .stat-num{ color:var(--danger); }
  .stat-card.warn .dot{ background:var(--danger); }
  .stat-card.ok{ background:linear-gradient(180deg, var(--success-wash) 0%, var(--surface) 100%); border-top-color:var(--success); }
  .stat-card.ok .stat-num{ color:var(--success); }
  .stat-card.ok .dot{ background:var(--success); }

  .panel-title{ font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; margin:0 0 8px; display:flex; align-items:center; gap:7px; }
  .panel-title .dot{ width:7px; height:7px; border-radius:50%; }
  .two-col-panels{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  .compact-card{ padding:10px 20px; margin-bottom:0; }

  /* ---------- Calendar & Planner ---------- */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .cal-grid-labels{ margin-bottom:4px; }
  .cal-day-label{ text-align:center; font-size:11px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }
  .cal-day{ min-height:70px; border:1px solid var(--border); border-radius:7px; padding:6px 7px; background:var(--surface); cursor:pointer; transition:box-shadow .12s, border-color .12s; }
  .cal-day:hover{ box-shadow:var(--shadow-sm); border-color:var(--border-strong); }
  .cal-day.other-month{ visibility:hidden; }
  .cal-day.today{ border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy); }
  .cal-day-num{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .cal-dots{ display:flex; gap:3px; margin-top:6px; flex-wrap:wrap; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .cal-dot.indigo{ background:var(--stat-indigo); }
  .cal-dot.purple{ background:var(--stat-purple); }
  .cal-dot.teal{ background:var(--stat-teal); }
  .cal-dot.blue{ background:var(--stat-blue); }
  .cal-legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); margin:10px 0 24px; }
  .cal-legend span{ display:flex; align-items:center; gap:6px; }

  .planner-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:30px; }
  .planner-day{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px; min-height:130px; display:flex; flex-direction:column; gap:6px; }
  .planner-day.today{ border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy); }
  .planner-day-head{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; display:flex; justify-content:space-between; }
  .planner-evt{ font-size:11px; padding:3px 6px; border-radius:5px; background:var(--neutral-wash); color:var(--ink-soft); }
  .planner-evt.indigo{ background:var(--stat-indigo-wash); color:var(--stat-indigo); }
  .planner-evt.purple{ background:var(--stat-purple-wash); color:var(--stat-purple); }
  .planner-evt.teal{ background:var(--stat-teal-wash); color:var(--stat-teal); }
  .planner-task{ display:flex; align-items:center; gap:6px; font-size:12.5px; }
  .planner-task input{ flex-shrink:0; }
  .planner-task span{ flex:1; word-break:break-word; }
  .planner-task-del{ background:none; border:none; color:var(--ink-faint); font-size:14px; cursor:pointer; padding:0 3px; line-height:1; }
  .planner-task-del:hover{ color:var(--danger); }
  .planner-add-btn{ margin-top:auto; background:none; border:1px dashed var(--border-strong); border-radius:6px; padding:5px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; }
  .planner-add-btn:hover{ border-color:var(--navy); color:var(--navy); }

  @media (max-width: 860px){
    .planner-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width: 480px){
    .cal-day-num{ font-size:11px; }
    .cal-day{ min-height:50px; padding:4px; }
  }

  .feed-item{ display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
  .feed-item.compact{ padding:12px 0; gap:12px; }
  .feed-item.compact .feed-body{ font-size:13px; line-height:1.55; }
  .feed-item:last-child{ border-bottom:none; }
  .feed-idx{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); width:26px; flex-shrink:0; padding-top:2px; }
  .feed-idx.mono{ width:64px; font-size:11px; }
  .feed-body{ flex:1; font-size:13.5px; line-height:1.55; color:var(--ink); }
  .feed-body b{ font-weight:600; }
  .feed-date{ color:var(--ink-faint); font-size:12px; }

  @media (max-width: 900px){
    .two-col-panels{ grid-template-columns:1fr; }
  }


  /* ---------- Entry cards ---------- */
  .entry-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);
    padding:20px 22px; margin-bottom:14px; border-left:4px solid transparent;
  }
  .entry-card.cat-navy{ border-left-color:var(--navy); }
  .entry-card.cat-indigo{ border-left-color:var(--stat-indigo); }
  .entry-card.cat-purple{ border-left-color:var(--stat-purple); }
  .entry-card.cat-blue{ border-left-color:var(--stat-blue); }
  .entry-card.cat-teal{ border-left-color:var(--stat-teal); }
  .entry-card.cat-cyan{ border-left-color:var(--stat-cyan); }
  .entry-card.cat-rose{ border-left-color:var(--stat-rose); }
  .entry-card.cat-neutral{ border-left-color:var(--ink-faint); }
  .entry-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .entry-idx{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); letter-spacing:.03em; text-transform:uppercase; }
  .entry-title{ font-family:'Roboto', sans-serif; font-size:17px; font-weight:600; margin-top:3px; color:var(--ink); }
  .entry-title.linkable, .task-link{ cursor:pointer; }

</style>

<script>
/* ============================ STATE ============================ */
const state = {
  identity: null,        // {role:'supervisor'|'cosupervisor'|'student', id, name}
  students: [],
  weekly: [],
  samples: [],
  papers: [],
  instructions: [],

const MEETING_TYPES = ['Weekly Review','Monthly Progress Presentation','Topic Discussion','Other'];

const CONFERENCE_ROLES = ['Attendee','Poster Presentation','Oral Presentation','Invited Talk'];

const COURSE_STATUSES = { not_started:{label:'Not Started', cls:'neutral'}, in_progress:{label:'In Progress', cls:'warn'}, completed:{label:'Completed', cls:'good'} };
const FABRICATION_STAGES = { prep:{label:'Sample Preparation', cls:'neutral'}, fabrication:{label:'Device Fabrication', cls:'warn'}, testing:{label:'Testing', cls:'warn'}, completed:{label:'Completed', cls:'good'}, on_hold:{label:'On Hold', cls:'bad'} };

const EVENT_STATUSES = { planned:{label:'Planned', cls:'neutral'}, in_progress:{label:'In Progress', cls:'warn'}, completed:{label:'Completed', cls:'good'} };

const TECHNIQUES = ['CV (Cyclic Voltammetry)','GCD (Galvanostatic Charge-Discharge)','Battery Testing','Cycling Test','EIS (Impedance Spectroscopy)','XRD','SEM','TEM','TGA/DSC','NMR','UV-Vis','FTIR','BET (Surface Area)','XPS','Raman','GC-MS','Other'];

/* ============================ HELPERS ============================ */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
// Native <input type="time"> always stores/returns 24-hour "HH:MM" — this
// converts that to 12-hour display text (e.g. "15:00" → "3:00 PM") for
// anywhere the time is shown as text. The input element itself is left
// alone; browsers render that picker per the OS/browser's own locale.
function fmtTime(t){
  if(!t) return '';
  const parts = t.split(':');
  let h = parseInt(parts[0], 10);
  const m = parts[1] || '00';
  if(isNaN(h)) return t;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if(h === 0) h = 12;
  return `${h}:${m} ${ampm}`;
}
// Meetings may have a start time only, a start+end range, or no time at all
// (just a date) — this renders whichever combination is actually set.
function fmtTimeRange(startTime, endTime){
  if(!startTime && !endTime) return '';
  if(startTime && endTime) return `${fmtTime(startTime)} – ${fmtTime(endTime)}`;
  return fmtTime(startTime || endTime);
}
const ORDINAL_WORDS = ['First','Second','Third','Fourth','Fifth','Sixth','Seventh','Eighth','Ninth','Tenth'];
function ordinalWord(n){
  return ORDINAL_WORDS[n-1] || (n + 'th');
}
// changeIndex counts how many target-date changes already exist BEFORE this
// one: 0 → the very first time it's set ("First target"), 1 → the first
// time it's changed after that ("First revised target"), 2 → "Second
// revised target", and so on — so it's always clear how many times a
// target date has moved, not just what it moved to most recently.
function targetDateChangeLabel(changeIndex){
  if(changeIndex <= 0) return 'First target';
  return ordinalWord(changeIndex) + ' revised target';
}
function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }
function studentName(id){ const s = state.students.find(x=>x.id===id); return s ? s.name : 'Unknown'; }
async function hashPin(pin){
  const enc = new TextEncoder().encode('logbook-salt::' + pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============================ DATA BACKEND (Google Sheet via Apps Script) ============================ */
// Paste the "Web app URL" you get after deploying the companion Apps Script
// (backend/Code.gs) here. Until this is set, the app shows a setup screen.
const DATA_API_URL = 'https://script.google.com/macros/s/AKfycbwb5fe0S1lhAFnh-YTSscn10Sjdrf81asj-AfmLQbS0bLuOqNU9kXie3rpNyWpi4e413A/exec';

// Must exactly match the APP_KEY constant in backend/Code.gs.
const APP_KEY = 'change-this-to-your-own-random-string-2026';

// A one-time setup key that must be entered to claim the Supervisor role for
// the FIRST time (before any passcode exists). Without this, whoever visits
// the app first and picks "Supervisor" could set themselves up as supervisor —
// this key ensures only the person given it by whoever deployed this app can
// become the supervisor. Change this to your own value, and only share it
// with the actual supervisor. Once the passcode is set, this key is no longer
// needed for logging in — only the passcode is checked from then on.
const SUPERVISOR_SETUP_KEY = 'change-this-setup-key-too';

function backendConfigured(){
  return typeof DATA_API_URL === 'string' && DATA_API_URL.startsWith('http');
}
async function apiGetAll(keys){
  // One request for everything instead of one request per collection — this is the
  // single biggest lever on load time, since each network round-trip to Apps Script
  // has real overhead (opening the spreadsheet, etc.) that adds up fast otherwise.
  const res = await fetch(DATA_API_URL + '?action=getAll&keys=' + encodeURIComponent(keys.join(',')) + '&key_check=' + encodeURIComponent(APP_KEY));
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json.values || {};
}
async function apiSetRaw(key, value){
  const res = await fetch(DATA_API_URL, {
    method: 'POST',
    body: JSON.stringify({ key, value, appKey: APP_KEY }) // no custom Content-Type — keeps this a "simple" request, avoiding CORS preflight issues with Apps Script
  });
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  return true;
}
async function apiNotify(type, payload){
  try{
    const res = await fetch(DATA_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'notify', type, payload, appKey: APP_KEY })
    });
    const json = await res.json().catch(()=>({}));
    if(!json.ok){ console.error('Notification failed (backend reported an error):', type, json.error); }
  }catch(e){ console.error('Notification failed to send (network/fetch error)', type, e); }
}
async function apiTestEmail(to){
  try{
    const res = await fetch(DATA_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'testEmail', to, appKey: APP_KEY })
    });
    const json = await res.json().catch(()=>({}));
    if(json.ok){
      alert(`Test email sent to ${to}. Check that inbox (and its spam folder).${json.remainingQuota!==undefined ? '\n\nRemaining daily send quota: ' + json.remainingQuota : ''}`);
    } else {
      alert(`Test email failed to send.\n\nError: ${json.error || 'Unknown error'}${json.remainingQuota!==undefined ? '\nRemaining daily send quota: ' + json.remainingQuota : ''}\n\nOpen the Apps Script editor → Executions (left sidebar) for the full error detail.`);
    }
  }catch(e){
    alert('Could not reach the backend to send a test email: ' + e.message);
  }
}
function testMyEmail(){
  let email = null;
  if(state.identity.role === 'student'){ const me = state.students.find(x=>x.id===state.identity.id); email = me?.email; }
  else if(state.identity.role === 'cosupervisor'){ const me = myCoSupervisorRecord(); email = me?.email; }
  else { email = state.supervisorEmail; }

function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim()); }

/* ============================ STORAGE ============================ */
async function saveCollection(key, arr){
  try{
    await apiSetRaw(key, JSON.stringify(arr));
  }catch(e){ console.error('Storage save failed', key, e); alert('Could not save your change — check your internet connection and try again. If this keeps happening, the Drive backend link may need to be reconnected.'); }
}
async function saveSupervisorProfile(profile){
  try{ await apiSetRaw('supervisor-pin', JSON.stringify(profile)); }catch(e){ console.error('Save supervisor profile failed', e); }
}

/* ============================ INIT ============================ */
// Every collection key the app needs at startup, fetched in one batched request.
const ALL_DATA_KEYS = ['students','weekly-reports','samples','papers','instructions','meetings','co-supervisors','proposals','conferences','planner-tasks','thesis-plans','rac-reviews','financial-applications','courses','fabrication-items','events','results-analysis','deletion-log','news-updates','supervisor-pin'];

async function init(){
  if(!backendConfigured()){
    renderSetupNeeded();
    return;
  }

  // Speed: show cached data (from the last successful load on this device)
  // instantly if we have it, while a fresh network fetch happens in the
  // background. This makes repeat visits feel instant instead of waiting
  // on a network round-trip before anything appears. If there's no cache
  // yet (first visit ever), we just show the normal loading screen.
  const cached = loadLocalCache();
  if(cached){
    applyDataValues(cached);
    renderLogin();
  } else {
    renderLoginLoading();
  }

  try{
    const values = await apiGetAll(ALL_DATA_KEYS);
    applyDataValues(values);
    saveLocalCache(values);
    // Only re-render the login screen if we're still on it — never clobber
    // an in-progress app session if this background refresh lands late.
    if(!state.identity) renderLogin();
  }catch(e){
    console.error('Failed to load from backend', e);
    if(!cached) renderBackendError(e); // if we had cached data on screen already, a transient network hiccup shouldn't rip it away
  }
}
function applyDataValues(values){
  const arr = (key) => { try{ return values[key] ? JSON.parse(values[key]) : []; }catch(e){ return []; } };
  state.students = arr('students');
  state.weekly = arr('weekly-reports');
  state.samples = arr('samples');
  state.papers = arr('papers');
  state.instructions = arr('instructions');
  state.meetings = arr('meetings');
  state.coSupervisors = arr('co-supervisors');
  state.proposals = arr('proposals');
  state.conferences = arr('conferences');
  state.plannerTasks = arr('planner-tasks');
  state.thesisPlans = arr('thesis-plans');
  state.racReviews = arr('rac-reviews');
  state.financialApps = arr('financial-applications');
  state.courses = arr('courses');
  state.fabricationItems = arr('fabrication-items');
  state.events = arr('events');
  state.resultsAnalysis = arr('results-analysis');
  state.deletionLog = arr('deletion-log');
  state.newsUpdates = arr('news-updates');
  let supervisorProfile = {};
  try{ supervisorProfile = values['supervisor-pin'] ? JSON.parse(values['supervisor-pin']) : {}; }catch(e){ supervisorProfile = {}; }
  state.supervisorPinHash = supervisorProfile.hash || null;
  state.supervisorEmail = supervisorProfile.email || null;
  state.supervisorName = supervisorProfile.name || null;
}
const LOCAL_CACHE_KEY = 'rgms-data-cache-v1';
function loadLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; } // private browsing, storage disabled, etc. — just skip the cache
}
function saveLocalCache(values){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(values)); }catch(e){ /* quota or storage unavailable — fine, cache is a bonus not a requirement */ }
}

function renderSetupNeeded(){

  document.getElementById('loginScreen').innerHTML = loginShell(`
    <div class="login-card">

      <div class="login-sub">
        This app stores its data in a Google Sheet in your Drive. Before it can be used, deploy the companion
        Apps Script (backend/Code.gs) as a Web App, then paste the Web app URL into the
        <code class="mono">DATA_API_URL</code> constant near the top of this file's &lt;script&gt; section — and make sure
        <code class="mono">APP_KEY</code> matches the one in Code.gs. Save, and reopen this page. See SETUP.md for full steps.
      </div>
    </div>`);
}
function renderBackendError(err){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appShell').style.display='none';
  const msg = err ? String(err.message || err) : '';
  let guidance = 'Check your internet connection, and confirm the Apps Script Web App is still deployed with "Anyone" access.';
  if(/unauthorized/i.test(msg)){
    guidance = 'The backend responded with "Unauthorized" — this means the APP_KEY in this file no longer matches the APP_KEY in your Code.gs. Open both and make sure they are character-for-character identical, then redeploy if you change either.';
  } else if(/returned \d{3}/i.test(msg)){
    guidance = `The backend responded with an error (${escapeHtml(msg)}). Open the Apps Script editor → Executions (left sidebar) to see the full error from the most recent run.`;
  } else if(msg){

  document.getElementById('loginScreen').innerHTML = loginShell(`
    <div class="login-card">

async function doLogin(){
  state.loginError = '';
  if(state.loginRole === 'supervisor'){
    const pin = document.getElementById('supervisorPin')?.value || '';
    if(!pin){ state.loginError = 'Please enter the supervisor passcode.'; renderLogin(); return; }
    if(state.supervisorPinHash){
      const hash = await hashPin(pin);
      if(hash !== state.supervisorPinHash){ state.loginError = 'Incorrect passcode.'; renderLogin(); return; }
      if(!state.supervisorEmail){
        const email = (document.getElementById('supervisorEmailInput')?.value || '').trim();
        if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
        state.supervisorEmail = email;
        await saveSupervisorProfile({ hash: state.supervisorPinHash, email, name: state.supervisorName });
      }
    } else {
      const setupKey = document.getElementById('supervisorSetupKey')?.value || '';
      if(setupKey !== SUPERVISOR_SETUP_KEY){ state.loginError = 'Incorrect setup key. Ask whoever deployed this app for the correct key — only they can tell you the right one.'; renderLogin(); return; }
      const name = (document.getElementById('supervisorName')?.value || '').trim() || 'Supervisor';
      const confirmPin = document.getElementById('supervisorPinConfirm')?.value || '';
      const email = (document.getElementById('supervisorEmailInput')?.value || '').trim();
      if(pin.length < 4){ state.loginError = 'Passcode must be at least 4 characters.'; renderLogin(); return; }
      if(pin !== confirmPin){ state.loginError = 'Passcodes do not match.'; renderLogin(); return; }
      if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
      const hash = await hashPin(pin);
      state.supervisorPinHash = hash;
      state.supervisorEmail = email;
      state.supervisorName = name;
      await saveSupervisorProfile({ hash, email, name });
    }
    state.identity = { role:'supervisor', id:'supervisor', name: state.supervisorName || 'Supervisor' };
    showApp();
  } else if(state.loginRole === 'student'){
    if(state.loginPickId === '__new__'){
      const name = (document.getElementById('newStudentName')?.value || '').trim();
      const email = (document.getElementById('newStudentEmail')?.value || '').trim();
      const pin = document.getElementById('newStudentPin')?.value || '';
      const pinConfirm = document.getElementById('newStudentPinConfirm')?.value || '';
      if(!name){ state.loginError = 'Please enter your name.'; renderLogin(); return; }
      if(state.students.some(s=>s.name.toLowerCase()===name.toLowerCase())){ state.loginError = 'That name already exists — select it from the list above instead.'; renderLogin(); return; }
      if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
      if(pin.length < 4){ state.loginError = 'PIN must be at least 4 characters.'; renderLogin(); return; }
      if(pin !== pinConfirm){ state.loginError = 'PINs do not match.'; renderLogin(); return; }
      const pinHash = await hashPin(pin);
      const newS = { id: uid('stu'), name, email, pinHash };
      state.students.push(newS);
      await saveCollection('students', state.students);
      apiNotify('newStudent', { name, studentId: newS.id });
      state.identity = { role:'student', id:newS.id, name:newS.name };
      showApp();
    } else if(state.loginPickId){
      const s = state.students.find(x=>x.id===state.loginPickId);
      if(s.pinHash){
        const pin = document.getElementById('existingStudentPin')?.value || '';
        if(!pin){ state.loginError = 'Please enter your PIN.'; renderLogin(); return; }
        const hash = await hashPin(pin);
        if(hash !== s.pinHash){ state.loginError = 'Incorrect PIN.'; renderLogin(); return; }
      } else {
        const pin = document.getElementById('firstTimeStudentPin')?.value || '';
        const pinConfirm = document.getElementById('firstTimeStudentPinConfirm')?.value || '';
        if(pin.length < 4){ state.loginError = 'PIN must be at least 4 characters.'; renderLogin(); return; }
        if(pin !== pinConfirm){ state.loginError = 'PINs do not match.'; renderLogin(); return; }
        s.pinHash = await hashPin(pin);
      }
      if(!s.email){
        const email = (document.getElementById('studentEmailBackfill')?.value || '').trim();
        if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
        s.email = email;
      }
      await saveCollection('students', state.students);
      state.identity = { role:'student', id:s.id, name:s.name };
      showApp();
    } else {
      state.loginError = 'Please select who you are, or add yourself as a new student.';
      renderLogin();
    }
  } else if(state.loginRole === 'cosupervisor'){
    if(!state.loginPickId){
      state.loginError = 'Please select who you are.';
      renderLogin();
      return;
    }
    const c = state.coSupervisors.find(x=>x.id===state.loginPickId);
    if(!c){ state.loginError = 'That account could not be found.'; renderLogin(); return; }
    if(c.pinHash){
      const pin = document.getElementById('existingCoSupPin')?.value || '';
      if(!pin){ state.loginError = 'Please enter your PIN.'; renderLogin(); return; }
      const hash = await hashPin(pin);
      if(hash !== c.pinHash){ state.loginError = 'Incorrect PIN.'; renderLogin(); return; }
    } else {
      const pin = document.getElementById('firstTimeCoSupPin')?.value || '';
      const pinConfirm = document.getElementById('firstTimeCoSupPinConfirm')?.value || '';
      if(pin.length < 4){ state.loginError = 'PIN must be at least 4 characters.'; renderLogin(); return; }
      if(pin !== pinConfirm){ state.loginError = 'PINs do not match.'; renderLogin(); return; }
      c.pinHash = await hashPin(pin);
    }
    if(!c.email){
      const email = (document.getElementById('coSupEmailBackfill')?.value || '').trim();
      if(!isValidEmail(email)){ state.loginError = 'Please enter a valid email address.'; renderLogin(); return; }
      c.email = email;
    }
    await saveCollection('co-supervisors', state.coSupervisors);
    state.identity = { role:'cosupervisor', id:c.id, name:c.name };
    showApp();
  } else {
    state.loginError = 'Please choose whether you are the supervisor, a mentor, or a research scholar.';
    renderLogin();
  }
}

  state.loginRole = null;
  state.loginPickId = null;

function showDigestPopup(){
  let bodyHtml = '';
  let primaryAction = '';
  if(isSupervisorLike()){
    const count = pendingQueue().length;
    bodyHtml = count>0
      ? `<p style="font-size:14px; line-height:1.6;">You have <b>${count}</b> item${count===1?'':'s'} waiting on your approval.</p>`
      : `<p style="font-size:14px; line-height:1.6; color:var(--ink-soft);">Nothing is waiting on your approval right now.</p>`;
    if(count>0) primaryAction = `<button class="action-btn" onclick="closeModal(); goView('approvals');">Go to Pending Approval</button>`;
  } else {
    const changesNeeded = changesRequestedQueue().length;
    const upcomingMeetings = state.meetings.filter(m=>m.studentId===state.identity.id && (m.status==='proposed'||m.status==='confirmed') && m.plannedDate>=todayStr()).length;
    if(changesNeeded>0){
      bodyHtml += `<p style="font-size:14px; line-height:1.6;"><b>${changesNeeded}</b> item${changesNeeded===1?'':'s'} need${changesNeeded===1?'s':''} your attention — your supervisor requested changes.</p>`;
      primaryAction = `<button class="action-btn" onclick="closeModal(); goView('changesRequested');">Go to Changes Requested</button>`;
    } else {
      bodyHtml += `<p style="font-size:14px; line-height:1.6; color:var(--ink-soft);">Nothing needs your attention right now.</p>`;
    }
    if(upcomingMeetings>0){
      bodyHtml += `<p style="font-size:13.5px; color:var(--ink-soft);">You have <b>${upcomingMeetings}</b> upcoming meeting${upcomingMeetings===1?'':'s'}.</p>`;
    }
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-head"><h3>Welcome back, ${escapeHtml(state.identity.name)}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          ${bodyHtml}
          <div class="modal-foot">
            <button class="small-btn" onclick="closeModal()">Dismiss</button>
            ${primaryAction}
          </div>
        </div>
      </div>
    </div>
  `;
}

function isSupervisorLike(){
  return state.identity.role === 'supervisor' || state.identity.role === 'cosupervisor';

function isTrueSupervisor(){
  // Deleting a logged record is restricted to the primary supervisor only —
  // not mentors/co-supervisors, and not the research scholar who owns it.
  // Everyone else can still edit (subject to the normal lock rules); only
  // the supervisor can remove an entry from the record entirely.
  return state.identity.role === 'supervisor';
}
function myCoSupervisorRecord(){
  return state.coSupervisors.find(c=>c.id===state.identity.id) || null;
}
// A mentor's assignments used to be one flat list of student IDs plus a
// single category applied to all of them. Now each assignment carries its
// own category, since the same person can be an Advisor for one scholar and
// a Co-Supervisor for another. This reads the new shape, and transparently
// upgrades any older record still using the flat list on the fly.
function mentorAssignments_(c){
  if(!c) return [];
  if(Array.isArray(c.assignments)) return c.assignments;
  return (c.assignedStudentIds||[]).map(studentId => ({ studentId, category: c.category || 'Co-Supervisor', notifySubmissions: !!c.notifySubmissions }));
}
// Only the true supervisor ever sees a Delete button (enforced per-section
// already via isTrueSupervisor() gates) — but this centralizes what happens
// once they click it: a required reason, a permanent log entry (since the
// record itself is about to disappear, this is the only place its removal
// gets recorded), and a notification to the scholar it belonged to.
async function deleteEntryWithReason(type, list, key, id, title, studentId){
  const reason = prompt(`Reason for deleting "${title}"? (required — this will be logged and the research scholar will be notified)`, '');
  if(reason === null) return false;
  if(!reason.trim()){ alert('A reason is required to delete this entry.'); return false; }
  const idx = list.findIndex(x=>x.id===id);
  if(idx===-1) return false;
  list.splice(idx,1);
  await saveCollection(key, list);
  const reviewer = reviewerIdentity(studentId);
  state.deletionLog.push({ id: uid('del'), type, title, studentId, deletedByName: reviewer.name, deletedByRole: reviewer.roleLabel, reason: reason.trim(), deletedAt: nowIST() });
  await saveCollection('deletion-log', state.deletionLog);
  apiNotify('entryDeleted', { studentId, title, type, reason: reason.trim(), deletedByName: reviewer.name, deletedByRole: reviewer.roleLabel });
  return true;
}
// India is a fixed UTC+5:30 offset with no daylight saving, so this can be
// computed directly rather than relying on the browser's local timezone.
function nowIST(){
  const now = new Date();
  const istMs = now.getTime() + (now.getTimezoneOffset() * 60000) + (5.5 * 60 * 60000);
  const ist = new Date(istMs);
  const datePart = ist.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  let h = ist.getHours();
  const m = String(ist.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  return `${datePart}, ${h}:${m} ${ampm} IST`;
}
function nowISTWithSeconds(){
  const now = new Date();
  const istMs = now.getTime() + (now.getTimezoneOffset() * 60000) + (5.5 * 60 * 60000);
  const ist = new Date(istMs);
  const datePart = ist.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  let h = ist.getHours();
  const m = String(ist.getMinutes()).padStart(2,'0');
  const sec = String(ist.getSeconds()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  return `${datePart}, ${h}:${m}:${sec} ${ampm} IST`;
}
let liveClockTimer = null;
// Ticks every second while the Overview page is showing. Since this app
// re-renders by replacing innerHTML rather than using a component
// framework, there's no "unmount" hook to clean this up when navigating
// away — so instead, each tick checks whether its own element is still in
// the page, and quietly stops itself the moment it isn't, rather than
// leaving a stray timer running (or stacking up a second one) once the
// person clicks to another section.
function startLiveClock(){
  if(liveClockTimer) clearInterval(liveClockTimer);
  const tick = () => {
    const el = document.getElementById('liveClock');
    const el2 = document.getElementById('rightColClock');
    if(!el && !el2){ clearInterval(liveClockTimer); liveClockTimer = null; return; }
    const stamp = nowISTWithSeconds();
    if(el) el.textContent = stamp;
    if(el2) el2.textContent = '⌚ ' + stamp;
  };
  tick();
  liveClockTimer = setInterval(tick, 1000);
}

// Whoever is clicking Approve/Reject right now — used to record "who
// reviewed this" on the entry itself, and to tell the backend who to credit
// in the notification email (the true supervisor, or a specific mentor by
// their category for THAT scholar: Advisor or Co-Supervisor — the same
// mentor can hold a different category for a different scholar, so the
// studentId the action concerns must be passed in).
function reviewerIdentity(studentId){
  if(state.identity.role === 'supervisor'){
    return { name: state.identity.name, roleLabel: 'Research Supervisor' };
  }
  if(state.identity.role === 'student'){
    return { name: state.identity.name, roleLabel: 'Research Scholar' };
  }
  const me = myCoSupervisorRecord();
  const assignment = me ? mentorAssignments_(me).find(a=>a.studentId===studentId) : null;
  return { name: state.identity.name, roleLabel: (assignment && assignment.category) || (me && me.category) || 'Co-Supervisor' };
}
function assignedStudentIds(){
  const cs = myCoSupervisorRecord();
  return cs ? mentorAssignments_(cs).map(a=>a.studentId) : [];
}
function visibleStudentsForIdentity(){
  if(state.identity.role === 'supervisor') return state.students;
  if(state.identity.role === 'cosupervisor'){
    const ids = assignedStudentIds();
    return state.students.filter(s=>ids.includes(s.id));
  }
  return state.students.filter(s=>s.id===state.identity.id);
}

function setFilterStudent(v){ state.filterStudentId = v; renderView(); }

function scopedList(arr){
  if(state.identity.role === 'student') return arr.filter(x => x.studentId === state.identity.id);
  if(state.identity.role === 'cosupervisor'){
    const ids = assignedStudentIds();
    const base = arr.filter(x => ids.includes(x.studentId));
    if(state.filterStudentId === 'all') return base;
    return base.filter(x => x.studentId === state.filterStudentId);
  }
  if(state.filterStudentId === 'all') return arr;
  return arr.filter(x => x.studentId === state.filterStudentId);
}

// assigned mentor to review, instead of leaving it ambiguous who's
// responsible when a scholar has more than one mentor. Once assigned, only
// that mentor (or the true supervisor, always) can act on it — see the
// canReview_() gate used on every card's Review button.
const REVIEWABLE_COLLECTIONS = {
  weekly:       { list: () => state.weekly,            key: 'weekly-reports' },
  sample:       { list: () => state.samples,           key: 'samples' },
  fabrication:  { list: () => state.fabricationItems,  key: 'fabrication-items' },

function titleForReviewable(type, entry){
  switch(type){
    case 'weekly': return `Week of ${fmtDate(entry.weekStart)}`;
    case 'sample': return entry.sampleName;
    case 'fabrication': return fabricationLabel(entry);
    case 'conference': return entry.eventName;
    default: return entry.title || '';
  }
}
// Whether the current user is allowed to see/use the Review controls on a
// given entry: the true supervisor always can; a mentor can only if the
// entry isn't assigned to someone specific, or is assigned to them.
function canReview_(entry){
  if(isTrueSupervisor()) return true;
  if(!isSupervisorLike()) return false;
  return !entry.assignedReviewerId || entry.assignedReviewerId === state.identity.id;
}
function mentorsForStudent_(studentId){
  return state.coSupervisors.filter(c => mentorAssignments_(c).some(a=>a.studentId===studentId));
}
async function assignReviewer(type, id, mentorId){
  const coll = REVIEWABLE_COLLECTIONS[type];
  if(!coll) return;
  const entry = coll.list().find(x=>x.id===id);
  if(!entry) return;
  if(mentorId){
    const mentor = state.coSupervisors.find(c=>c.id===mentorId);
    if(!mentor) return;
    const assignment = mentorAssignments_(mentor).find(a=>a.studentId===entry.studentId);
    entry.assignedReviewerId = mentorId;
    entry.assignedReviewerName = mentor.name;
    entry.assignedReviewerRole = (assignment && assignment.category) || 'Co-Supervisor';
    await saveCollection(coll.key, coll.list());
    if(mentor.email){
      apiNotify('reviewAssigned', { mentorEmail: mentor.email, studentName: studentName(entry.studentId), title: titleForReviewable(type, entry), category: entry.assignedReviewerRole });
    }
  } else {
    entry.assignedReviewerId = null;
    entry.assignedReviewerName = null;
    entry.assignedReviewerRole = null;
    await saveCollection(coll.key, coll.list());
  }
  renderView();
}

function thisWeekItems(){

  scopedList(state.weekly).filter(w=>w.weekStart===monday).forEach(w=>{
    const preview = (w.workDone||'').slice(0,70) + ((w.workDone||'').length>70 ? '…' : '');
    items.push({ type:'weekly', id:w.id, studentId:w.studentId, category:'Weekly Plan', color:'var(--stat-blue)',
      title: preview || 'Weekly plan logged' });
  });

  scopedList(state.meetings).filter(m=> m.plannedDate>=monday && m.plannedDate<=sunday && m.status!=='cancelled').forEach(m=>{
    items.push({ type:'meeting', id:m.id, studentId:m.studentId, category:'Meeting · '+fmtDate(m.plannedDate)+((m.startTime||m.endTime||m.plannedTime)?' · '+fmtTimeRange(m.startTime||m.plannedTime, m.endTime):''), color:'var(--stat-indigo)',

  scopedList(state.fabricationItems).filter(it=> it.stage!=='completed' && it.stage!=='on_hold').forEach(it=>{

function renderStatusPie(counts, size){
  size = size || 130;
  const inset = Math.round(size * 0.14);
  const total = counts.approved + counts.pending + counts.changes_requested;
  if(total === 0){
    return `<div class="empty-state"><div class="em-title">Nothing to show yet</div><div class="em-sub">Once items are submitted, their approval status will appear here.</div></div>`;
  }
  const segments = [
    { key:'approved', label:'Approved', color:'var(--success)', count: counts.approved },
    { key:'pending', label:'Pending Approval', color:'var(--warning)', count: counts.pending },
    { key:'changes_requested', label:'Changes Requested', color:'var(--danger)', count: counts.changes_requested }
  ];
  let acc = 0;
  const stops = segments.map(seg=>{
    const pct = (seg.count/total)*100;
    const start = acc;
    acc += pct;
    return `${seg.color} ${start}% ${acc}%`;
  }).join(', ');
  return `
    <div style="display:flex; align-items:center; gap:22px; flex-wrap:wrap;">
      <div style="position:relative; width:${size}px; height:${size}px; flex-shrink:0;">
        <div style="width:100%; height:100%; border-radius:50%; background:conic-gradient(${stops});"></div>
        <div style="position:absolute; inset:${inset}px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <div style="font-size:${Math.round(size*0.17)}px; font-weight:700; color:var(--ink); line-height:1;">${total}</div>
          <div style="font-size:${Math.max(9,Math.round(size*0.077))}px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;">Total</div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; flex:1; min-width:150px;">
        ${segments.map(seg=>`
          <div style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <span style="width:9px; height:9px; border-radius:50%; background:${seg.color}; flex-shrink:0;"></span>
            <span style="flex:1; color:var(--ink-soft);">${seg.label}</span>
            <span style="font-weight:700; color:var(--ink);">${seg.count}</span>
            <span class="entry-meta" style="width:38px; text-align:right;">${total? Math.round((seg.count/total)*100):0}%</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function approvalCounts(list, statusField){
  const counts = { approved:0, pending:0, changes_requested:0 };
  list.forEach(item => { const s = item[statusField]; if(counts[s]!==undefined) counts[s]++; });
  return counts;
}
function statusFilterOptions(currentValue, setterFnName){
  return `
    <select onchange="${setterFnName}(this.value)">
      <option value="all" ${currentValue==='all'?'selected':''}>All statuses</option>

function sectionPieAndFilter(fullList, statusField, currentFilterValue, setterFnName){

          ${visible.map(s=>{
            const w = state.weekly.filter(x=>x.studentId===s.id);
            const sm = state.samples.filter(x=>x.studentId===s.id);
            const p = state.papers.filter(x=>x.studentId===s.id);
            const m = state.meetings.filter(x=>x.studentId===s.id);
            const pending = w.filter(x=>x.status==='pending').length + sm.filter(x=>x.approvalStatus==='pending').length + p.filter(x=>!!x.pendingStage).length + m.filter(x=>x.status==='proposed').length;
            const awaiting = sm.filter(x=>!x.resultsReceivedDate).length;
            const active = p.filter(x=>x.stage!=='Published').length;
            const next = m.filter(x=>(x.status==='proposed'||x.status==='confirmed') && x.plannedDate>=todayStr()).sort((a,b)=>a.plannedDate.localeCompare(b.plannedDate))[0];
            return `<tr>
              <td style="padding-left:18px; font-weight:600;">${escapeHtml(s.name)}</td>
              <td>${pending>0 ? `<span class="stamp warn" style="padding:3px 9px;">${pending}</span>` : '0'}</td>
              <td>${awaiting}</td>
              <td>${active}</td>
              <td>${next ? fmtDate(next.plannedDate) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function backupSection(){
  const role = state.identity.role;

  return `

    <div class="entry-card">

        This logbook saves automatically as you go, but that storage lives with the app, not in your Drive. To keep a real copy in Google Drive:

        <br>2. Drag it into a folder in Drive — or upload it in a chat with Claude and ask Claude to save it to your Drive for you.

        ` : ''}
      </div>
      ${isSupervisor ? `<div class="entry-meta" style="margin-top:10px;">Restoring replaces the group's current data with what's in the file — use it to recover a backup, not to merge two copies. Restoring is limited to the supervisor account.</div>` : ''}
    </div>
  `;
}
function downloadBackup(){
  const role = state.identity.role;
  const isSupervisor = role === 'supervisor';
  const visible = visibleStudentsForIdentity();
  const scope = isSupervisor ? 'full-group' : role === 'cosupervisor' ? 'assigned-students-only' : 'own-records-only';
  const data = {
    exportedAt: new Date().toISOString(),
    exportedBy: state.identity.name,
    scope,
    students: visible.map(s=>({id:s.id, name:s.name, email:s.email||''})),
    weeklyReports: scopedList(state.weekly),
    samples: scopedList(state.samples),
    papers: scopedList(state.papers),
    proposals: scopedList(state.proposals),
    conferences: scopedList(state.conferences),
    plannerTasks: scopedList(state.plannerTasks),
    thesisPlans: scopedList(state.thesisPlans),
    racReviews: scopedList(state.racReviews),
    financialApps: scopedList(state.financialApps),
    courses: scopedList(state.courses),
    fabricationItems: scopedList(state.fabricationItems),
    events: visibleEvents(),
    resultsAnalysis: scopedList(state.resultsAnalysis),
    deletionLog: scopedList(state.deletionLog),
    newsUpdates: state.newsUpdates,
    instructions: scopedList(state.instructions),
    meetings: scopedList(state.meetings),
    coSupervisors: isSupervisor ? state.coSupervisors.map(c=>({id:c.id, name:c.name, email:c.email||'', assignments:mentorAssignments_(c)})) : undefined
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `logbook-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function handleRestoreFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert('That file is not valid JSON.'); return; }
    if(!Array.isArray(parsed.weeklyReports) || !Array.isArray(parsed.samples) || !Array.isArray(parsed.papers) || !Array.isArray(parsed.students)){
      alert("This file doesn't look like a logbook backup — missing expected fields.");
      return;
    }
    if(!confirm(`This will replace the group's current data with the contents of "${file.name}". This cannot be undone. Continue?`)) return;
    state.students = parsed.students.map(s => {
      const existing = state.students.find(x=>x.id===s.id);
      return { ...s, pinHash: existing?.pinHash || s.pinHash || null, email: s.email || existing?.email || '' };
    });
    state.weekly = parsed.weeklyReports;
    state.samples = parsed.samples;
    state.papers = parsed.papers;
    state.proposals = Array.isArray(parsed.proposals) ? parsed.proposals : state.proposals;
    state.conferences = Array.isArray(parsed.conferences) ? parsed.conferences : state.conferences;
    state.plannerTasks = Array.isArray(parsed.plannerTasks) ? parsed.plannerTasks : state.plannerTasks;
    state.thesisPlans = Array.isArray(parsed.thesisPlans) ? parsed.thesisPlans : state.thesisPlans;
    state.racReviews = Array.isArray(parsed.racReviews) ? parsed.racReviews : state.racReviews;
    state.financialApps = Array.isArray(parsed.financialApps) ? parsed.financialApps : state.financialApps;
    state.courses = Array.isArray(parsed.courses) ? parsed.courses : state.courses;
    state.fabricationItems = Array.isArray(parsed.fabricationItems) ? parsed.fabricationItems : state.fabricationItems;
    state.instructions = Array.isArray(parsed.instructions) ? parsed.instructions : state.instructions;
    state.meetings = Array.isArray(parsed.meetings) ? parsed.meetings : state.meetings;
    state.events = Array.isArray(parsed.events) ? parsed.events : state.events;
    state.resultsAnalysis = Array.isArray(parsed.resultsAnalysis) ? parsed.resultsAnalysis : state.resultsAnalysis;
    state.deletionLog = Array.isArray(parsed.deletionLog) ? parsed.deletionLog : state.deletionLog;
    state.newsUpdates = Array.isArray(parsed.newsUpdates) ? parsed.newsUpdates : state.newsUpdates;
    if(Array.isArray(parsed.coSupervisors)){
      state.coSupervisors = parsed.coSupervisors.map(c => {
        const existing = state.coSupervisors.find(x=>x.id===c.id);
        return { ...c, pinHash: existing?.pinHash || null };
      });
    }
    await Promise.all([
      saveCollection('students', state.students),

/* ============================ CALENDAR & WEEKLY PLANNER ============================ */
function shiftMonth(ymStr, delta){
  const [y,m] = ymStr.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(ymStr){
  const [y,m] = ymStr.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
}
function buildMonthCells(ymStr){
  const [y,m] = ymStr.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const firstDow = (first.getDay()+6)%7; // Monday = 0
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  return new Date(d.setDate(diff)).toISOString().slice(0,10);
}
function shiftDate(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function weekDates(monday){
  const out = [];
  for(let i=0;i<7;i++) out.push(shiftDate(monday, i));
  return out;
}
function eventsForDate(dateStr){
  const out = [];
  scopedList(state.meetings).forEach(m=>{ if(m.plannedDate===dateStr) out.push({ type:'meeting', label:`${m.type}: ${m.title}`, cls:'indigo' }); });
  scopedList(state.conferences).forEach(c=>{
    const end = c.endDate || c.startDate;
    if(c.startDate<=dateStr && dateStr<=end) out.push({ type:'conference', label:c.eventName, cls:'purple' });
  });
  scopedList(state.proposals).forEach(pr=>{
    (pr.goals||[]).forEach(g=>{ if(g.targetDate===dateStr) out.push({ type:'goal', label:g.text, cls:'teal' }); });
  });
  scopedList(state.plannerTasks).forEach(t=>{ if(t.date===dateStr) out.push({ type:'task', label:t.text, cls:'blue' }); });
  return out;
}
function viewCalendar(){
  if(!state.calendarMonth) state.calendarMonth = todayStr().slice(0,7);
  if(!state.plannerWeekStart) state.plannerWeekStart = getMondayStr();
  const cells = buildMonthCells(state.calendarMonth);
  const weekdayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Calendar &amp; Weekly Planner</div>
        <div class="view-sub">All scheduled meetings, conferences, and goal deadlines at a glance — plus a day-by-day planner for the week ahead.</div>
      </div>
    </div>
    ${supervisorFilterBar()}

      <button class="small-btn" onclick="shiftCalendarMonth(-1)">‹ Prev</button>
      <h3 class="panel-title" style="margin:0;"><span class="dot" style="background:var(--navy);"></span>${monthLabel(state.calendarMonth)}</h3>
      <button class="small-btn" onclick="shiftCalendarMonth(1)">Next ›</button>
    </div>
    <div class="cal-grid cal-grid-labels">
      ${weekdayLabels.map(l=>`<div class="cal-day-label">${l}</div>`).join('')}
    </div>
    <div class="cal-grid">
      ${cells.map(dateStr=>{
        if(!dateStr) return `<div class="cal-day other-month"></div>`;
        const evts = eventsForDate(dateStr);

        return `<div class="cal-day ${isToday?'today':''}" onclick="jumpToWeekOf('${dateStr}')" title="${evts.length} item(s)">
          <div class="cal-day-num">${dayNum}</div>
          <div class="cal-dots">${evts.slice(0,5).map(e=>`<span class="cal-dot ${e.cls}" title="${escapeHtml(e.label)}"></span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="cal-legend">
      <span><span class="cal-dot indigo"></span> Meetings</span>
      <span><span class="cal-dot purple"></span> Conferences</span>
      <span><span class="cal-dot teal"></span> Goal deadlines</span>
      <span><span class="cal-dot blue"></span> Planner tasks</span>
    </div>
    <div class="entry-meta" style="margin-bottom:10px;">Click any day to jump the planner below to that week.</div>

    ${weeklyPlannerPanel()}
  `;
}

  `;
}
function setFilterProposalStatus(v){ state.filterProposalStatus = v; renderView(); }
function proposalStatusMap(){
  return {
    pending: { label:'Pending Approval', cls:'warn' },
    approved: { label:'Approved', cls:'good' },
    changes_requested: { label:'Changes Requested', cls:'bad' }
  };
}
function goalRow(pr, g, canEdit, canManage, isOwner){
  const today = todayStr();
  const overdue = !g.done && g.targetDate && g.targetDate < today;
  let progressPct = null;
  if(g.startDate && g.targetDate && g.targetDate > g.startDate){
    const start = new Date(g.startDate+'T00:00:00').getTime();
    const target = new Date(g.targetDate+'T00:00:00').getTime();
    const now = new Date(today+'T00:00:00').getTime();
    progressPct = Math.max(0, Math.min(100, Math.round(((now-start)/(target-start))*100)));
  }
  const barColor = g.done ? 'var(--success)' : overdue ? 'var(--danger)' : 'var(--stat-blue)';
  return `
    <div style="border:1px solid var(--border); border-radius:7px; padding:11px 14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" ${g.done?'checked':''} ${canManage || isOwner ? '' : 'disabled'} onchange="toggleProposalGoal('${pr.id}','${g.id}')">
        <span style="flex:1; font-size:13.5px; ${g.done?'text-decoration:line-through; color:var(--ink-faint);':''}">${escapeHtml(g.text)}</span>
        ${overdue ? `<span class="stamp bad" style="padding:2px 8px; font-size:10px;">Overdue</span>` : ''}
        ${canEdit ? `<button class="small-btn" style="padding:1px 7px; font-size:11px;" onclick="deleteProposalGoal('${pr.id}','${g.id}')">Remove</button>` : ''}
      </div>
      ${(g.startDate || g.targetDate) ? `
        <div style="display:flex; align-items:center; gap:8px; margin-top:7px;">
          <span class="entry-meta mono" style="font-size:11px;">${g.startDate ? fmtDate(g.startDate) : '—'} → ${g.targetDate ? fmtDate(g.targetDate) : 'no target date'}</span>
        </div>
        ${progressPct!==null ? `
          <div style="height:5px; border-radius:3px; background:var(--neutral-wash); margin-top:6px; overflow:hidden;">
            <div style="height:100%; width:${progressPct}%; background:${barColor}; border-radius:3px;"></div>
          </div>
        ` : ''}
      ` : ''}
    </div>
  `;
}
function proposalCard(pr, i, total){
  const isOwner = state.identity.role==='student' && pr.studentId===state.identity.id;
  const canManage = isSupervisorLike();
  const locked = pr.status === 'approved' && isOwner;
  const canEdit = canManage || (isOwner && !locked);
  const canDelete = isTrueSupervisor();
  const st = proposalStatusMap()[pr.status] || proposalStatusMap().pending;
  const goals = pr.goals || [];
  const doneCount = goals.filter(g=>g.done).length;
  return `
    <div class="entry-card cat-indigo" id="item-proposal-${pr.id}">
      <div class="entry-top">
        <div>
          <div class="entry-idx">PR${String(total-i).padStart(2,'0')} · ${escapeHtml(studentName(pr.studentId))}</div>
          <div class="entry-title">${escapeHtml(pr.title)}</div>
          ${goals.length>0 ? `<div class="entry-meta">${doneCount} of ${goals.length} goals complete</div>` : ''}
        </div>
        <span class="stamp ${st.cls}">${st.label}</span>
      </div>
      <div class="entry-block"><span class="lbl">Objective</span>${nl2br(pr.objective) || '—'}</div>
      ${(pr.linkedPaperIds && pr.linkedPaperIds.length>0) ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Linked to paper(s)</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${pr.linkedPaperIds.map(pid=>{
              const p = state.papers.find(x=>x.id===pid);
              return p ? `<span class="task-link stamp neutral" onclick="goToItem('paper','${p.id}','${pr.studentId}')">${escapeHtml(p.title)}</span>` : '';
            }).join('')}
          </div>
        </div>
      ` : ''}
      <div class="entry-block" style="margin-top:10px;">
        <span class="lbl">Goals / milestones</span>
        ${goals.length===0 ? `<span class="entry-meta">No goals added yet.</span>` : `
          <div style="margin-top:6px; display:flex; flex-direction:column; gap:8px;">
            ${goals.map(g=>goalRow(pr, g, canEdit, canManage, isOwner)).join('')}
          </div>
        `}

/* ============================ THESIS PLAN ============================ */
function thesisStatusMap(){
  return {
    pending: { label:'Pending Approval', cls:'warn' },
    approved: { label:'Approved', cls:'good' },
    changes_requested: { label:'Changes Requested', cls:'bad' }
  };
}
function thesisProgress(tp){
  const chapters = tp.chapters || [];
  const linkedPaperIds = [...new Set(chapters.map(c=>c.linkedPaperId).filter(Boolean))];
  const linkedPapers = linkedPaperIds.map(id => state.papers.find(p=>p.id===id)).filter(Boolean);
  const papersPublished = linkedPapers.filter(p=>p.stage==='Published').length;
  const totalPlanned = tp.totalPlannedPapers || 0;
  const paperPct = totalPlanned > 0 ? Math.round((papersPublished/totalPlanned)*100) : null;

  const chaptersTotal = chapters.length;
  const chaptersDone = chapters.filter(c=>c.status==='done').length;
  const chapterPct = chaptersTotal > 0 ? Math.round((chaptersDone/chaptersTotal)*100) : null;

  const myProposals = state.proposals.filter(pr=>pr.studentId===tp.studentId);
  const allGoals = myProposals.flatMap(pr=>pr.goals||[]);
  const goalsDone = allGoals.filter(g=>g.done).length;
  const goalsTotal = allGoals.length;
  const goalPct = goalsTotal > 0 ? Math.round((goalsDone/goalsTotal)*100) : null;

  const parts = [paperPct, chapterPct, goalPct].filter(p=>p!==null);
  const overallPct = parts.length ? Math.round(parts.reduce((a,b)=>a+b,0)/parts.length) : 0;

  return { linkedPaperIds, linkedPapers, papersPublished, totalPlanned, paperPct, chaptersTotal, chaptersDone, chapterPct, goalsDone, goalsTotal, goalPct, overallPct };
}

        <span style="color:var(--ink-soft);">${label}</span>
        <span style="font-weight:600;">${total>0 ? `${done} / ${total}` : '—'}${pct!==null ? ` · ${pct}%` : ''}</span>
      </div>
      <div style="height:7px; border-radius:4px; background:var(--neutral-wash); overflow:hidden;">
        <div style="height:100%; width:${pct||0}%; background:${color}; border-radius:4px;"></div>

}

  `;

function setFilterRacStatus(v){ state.filterRacStatus = v; renderView(); }
function racCard(r, i, total){
  const isOwner = state.identity.role==='student' && r.studentId===state.identity.id;
  const canManage = isSupervisorLike();
  const locked = r.status === 'approved' && isOwner;
  const canEdit = canManage || (isOwner && !locked);
  const st = racStatusMap()[r.status] || racStatusMap().pending;
  const items = r.actionItems || [];
  const doneCount = items.filter(it=>it.done).length;
  const pct = items.length ? Math.round((doneCount/items.length)*100) : null;
  return `
    <div class="entry-card cat-rose" id="item-rac-${r.id}">
      <div class="entry-top">
        <div>
          <div class="entry-idx">RAC${String(total-i).padStart(2,'0')} · ${escapeHtml(studentName(r.studentId))}</div>
          <div class="entry-title">${escapeHtml(r.title)}</div>
          <div class="entry-meta">${fmtDate(r.reviewDate)}${r.committeeMembers ? ' · ' + escapeHtml(r.committeeMembers) : ''}</div>
        </div>
        <span class="stamp ${st.cls}">${st.label}</span>
      </div>
      ${r.comments ? `<div class="entry-block"><span class="lbl">Committee comments</span>${nl2br(r.comments)}</div>` : ''}
      <div class="entry-block" style="margin-top:10px;">
        <span class="lbl">Action plan</span>
        ${items.length>0 ? progressBarRow('Action items complete', doneCount, items.length, pct, 'var(--stat-teal)') : `<span class="entry-meta">No action items added yet.</span>`}
        ${items.length>0 ? `
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
            ${items.map(it=>racActionItemRow(r, it, canEdit, canManage, isOwner)).join('')}
          </div>
        ` : ''}
        ${canEdit ? `<div class="entry-actions" style="margin-top:8px;"><button class="small-btn" onclick="openAddRacItemModal('${r.id}')">+ Add action item</button></div>` : ''}
      </div>
      ${r.supervisorNote ? `<div class="comment-box"><span class="lbl">${r.reviewedByName ? `Feedback from ${escapeHtml(r.reviewedByName)} (${escapeHtml(r.reviewedByRole)}) on ${escapeHtml(r.reviewedAt||'')}` : 'Supervisor feedback'}</span><div class="comment-existing">${nl2br(r.supervisorNote)}</div></div>` : ''}
      ${reviewHistoryHtml(r)}
      ${editHistoryHtml(r)}
      ${createdByHtml(r)}
      ${locked ? `<div class="entry-meta" style="margin-top:10px;">Approved reviews are locked — contact your supervisor if this needs to change.</div>` : ''}
      <div class="entry-actions">
        ${canReview_(r) ? `<button class="small-btn" onclick="openRacReviewBox('${r.id}')">Review</button>` : (isSupervisorLike() && r.assignedReviewerId ? `<span class="entry-meta">Assigned to ${escapeHtml(r.assignedReviewerName)} for review</span>` : '')}
        ${(isSupervisorLike() && r.status==='approved') ? `<button class="small-btn" onclick="addAdditionalComment('rac','${r.id}')">+ Add comment</button>` : ''}
        ${canEdit ? `<button class="small-btn" onclick="openEditRacModal('${r.id}')">Edit</button>` : ''}
        ${isTrueSupervisor() ? `<button class="small-btn danger" onclick="deleteRac('${r.id}')">Delete</button>` : ''}
      </div>
      <div id="racReviewSlot-${r.id}"></div>
    </div>
  `;
}
function racActionItemRow(r, it, canEdit, canManage, isOwner){
  const today = todayStr();
  const overdue = !it.done && it.targetDate && it.targetDate < today;
  return `
    <div style="border:1px solid var(--border); border-radius:7px; padding:11px 14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" ${it.done?'checked':''} ${canManage || isOwner ? '' : 'disabled'} onchange="toggleRacActionItem('${r.id}','${it.id}')">
        <span style="flex:1; font-size:13.5px; ${it.done?'text-decoration:line-through; color:var(--ink-faint);':''}">${escapeHtml(it.text)}</span>
        ${overdue ? `<span class="stamp bad" style="padding:2px 8px; font-size:10px;">Overdue</span>` : ''}
        ${canEdit ? `<button class="small-btn" style="padding:1px 7px; font-size:11px;" onclick="deleteRacActionItem('${r.id}','${it.id}')">Remove</button>` : ''}
      </div>
      ${it.targetDate ? `<div class="entry-meta mono" style="font-size:11px; margin-top:6px;">Target: ${fmtDate(it.targetDate)}</div>` : ''}
