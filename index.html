// Records every status transition for a work item — never overwrites past
// transitions, so the full history of Not Started → In Progress →
// Completed (etc.) stays visible, with who changed it, when, and their role.
// Every review action appends here rather than overwriting — so if an
// entry is reviewed, changes are requested, resubmitted, and approved, all
// three of those reviews stay visible, in order, forever. The current
// supervisorNote/status fields are still kept in sync for the rest of the
// UI that reads "the current feedback", but this array is the permanent
// record nothing in it is ever deleted or replaced.
function pushReviewHistory_(entry, decision, note){
  if(!entry.reviewHistory) entry.reviewHistory = [];
  const reviewer = reviewerIdentity(entry.studentId);
  entry.reviewHistory.push({ decision, note: note||'', reviewedByName: reviewer.name, reviewedByRole: reviewer.roleLabel, reviewedAt: nowIST() });
}
function reviewHistoryHtml(entry){
  if(!entry.reviewHistory || entry.reviewHistory.length===0) return '';
  const decisionLabel = { approved:'Approved', changes_requested:'Changes requested', comment:'Comment', rejected:'Rejected' };
  return `
    <div class="entry-block" style="margin-top:8px;">
      <span class="lbl">Full review history (${entry.reviewHistory.length})</span>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">
        ${entry.reviewHistory.slice().reverse().map(h=>`
          <div style="border-left:2px solid var(--border-strong); padding-left:10px;">
            <div class="entry-meta"><b>${escapeHtml(decisionLabel[h.decision]||h.decision)}</b> by ${escapeHtml(h.reviewedByName)} (${escapeHtml(h.reviewedByRole)}) on ${escapeHtml(h.reviewedAt)}</div>
            ${h.note ? `<div style="font-size:13px; margin-top:2px;">${nl2br(h.note)}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
// Lets the supervisor or any connected mentor leave commentary on an
// already-approved entry without touching its status or overwriting the
// approval note that's already there — purely additive.
async function addAdditionalComment(type, id){
  const coll = REVIEWABLE_COLLECTIONS[type];
  if(!coll) return;
  const entry = coll.list().find(x=>x.id===id);
  if(!entry) return;
  const text = prompt('Additional comment (added without changing the current approval status; the scholar, supervisor, and any other connected mentor will be notified):', '');
  if(text === null) return;
  if(!text.trim()){ alert('Please enter a comment.'); return; }
  pushReviewHistory_(entry, 'comment', text.trim());
  await saveCollection(coll.key, coll.list());
  const reviewer = reviewerIdentity(entry.studentId);
  apiNotify('additionalCommentAdded', { studentId: entry.studentId, title: titleForReviewable(type, entry), comment: text.trim(), addedByName: reviewer.name, addedByRole: reviewer.roleLabel, commenterId: state.identity.id });
  renderView();
}
// When the SUPERVISOR or a MENTOR edits a scholar's own work directly —
// not a review, an actual content change — that's recorded here and
// everyone connected to that scholar is notified: the scholar, the
// supervisor (unless they're the one editing), and any other mentor
// assigned to them. A scholar editing their own work is normal and isn't
// flagged this way — only staff-made edits are.
function logStaffEdit_(entry, title, type){
  if(!isSupervisorLike()) return;
  const editor = reviewerIdentity(entry.studentId);
  if(!entry.editHistory) entry.editHistory = [];
  entry.editHistory.push({ editedByName: editor.name, editedByRole: editor.roleLabel, editedAt: nowIST() });
  apiNotify('workItemEdited', { studentId: entry.studentId, title, type, editedByName: editor.name, editedByRole: editor.roleLabel, commenterId: state.identity.id });
}
// Same idea, but for a brand-new entry logged by staff on a scholar's
// behalf rather than an edit to something that already existed — the
// scholar had no part in creating it, so they need to be told it exists.
// A scholar creating their own entry isn't flagged; only staff-authored
// creation is.
function logStaffCreate_(entry, title, type){
  if(!isSupervisorLike()) return;
  const creator = reviewerIdentity(entry.studentId);
  entry.createdByName = creator.name;
  entry.createdByRole = creator.roleLabel;
  entry.createdAt = nowIST();
  apiNotify('workItemEdited', { studentId: entry.studentId, title, type, editedByName: creator.name, editedByRole: creator.roleLabel, commenterId: state.identity.id, isNewEntry: true });
}
function editHistoryHtml(entry){
  if(!entry.editHistory || entry.editHistory.length===0) return '';
  return `
    <div class="entry-block" style="margin-top:8px;">
      <span class="lbl">Edited by staff (${entry.editHistory.length})</span>
      <div style="display:flex; flex-direction:column; gap:3px; margin-top:4px;">
        ${entry.editHistory.slice().reverse().map(h=>`<div class="entry-meta">${escapeHtml(h.editedByName)} (${escapeHtml(h.editedByRole)}) on ${escapeHtml(h.editedAt)}</div>`).join('')}

}
function createdByHtml(entry){

function pushStatusHistory_(entry, fromStatus, toStatus, studentIdOverride){
  if(!entry.statusHistory) entry.statusHistory = [];
  const reviewer = reviewerIdentity(studentIdOverride || entry.studentId);
  entry.statusHistory.push({ from: fromStatus, to: toStatus, changedByName: reviewer.name, changedByRole: reviewer.roleLabel, changedAt: nowIST() });

        ${entry.statusHistory.slice().reverse().map(h=>`<div class="entry-meta">${h.from?escapeHtml(h.from)+' → ':''}${escapeHtml(h.to)} — ${escapeHtml(h.changedByName)} (${escapeHtml(h.changedByRole)}) on ${escapeHtml(h.changedAt)}</div>`).join('')}
      </div>
    </div>
  `;
}

function viewWeekly(){

function weeklyCard(w, i, total){
  const isOwner = state.identity.role==='student' && w.studentId===state.identity.id;
  const canManage = isSupervisorLike();
  const weekEnded = w.weekStart && shiftDate(w.weekStart, 6) < todayStr();
  // Locked once approved, or once the week itself is over — a scholar can't
  // quietly rewrite a past week's log. The one way back in is the supervisor
  // explicitly using "Request changes", which always re-opens editing
  // regardless of approval status or how old the week is.
  const locked = isOwner && w.status !== 'changes_requested' && (w.status === 'approved' || weekEnded);
  const canEdit = canManage || (isOwner && !locked);
  const canDelete = isTrueSupervisor();
  const statusMap = {
    pending: { label:'Pending Approval', cls:'warn' },
    approved: { label:'Approved', cls:'good' },
    changes_requested: { label:'Changes Requested', cls:'bad' }
  };
  const st = statusMap[w.status] || statusMap.pending;
  return `
    <div class="entry-card cat-blue" id="item-weekly-${w.id}">
      <div class="entry-top">
        <div>
          <div class="entry-idx">W${String(total-i).padStart(2,'0')} · ${escapeHtml(studentName(w.studentId))}</div>
          <div class="entry-title">Week of ${fmtDate(w.weekStart)} <span class="entry-meta" style="font-weight:400;">→ ${fmtDate(shiftDate(w.weekStart,6))}</span></div>
        </div>
        <span class="stamp ${st.cls}">${st.label}</span>
      </div>
      <div class="entry-grid">
        <div class="entry-block"><span class="lbl">Work done</span>${nl2br(w.workDone) || '—'}</div>
        <div class="entry-block"><span class="lbl">Plan for next week</span>${nl2br(w.planNext) || '—'}</div>
        ${w.challenges ? `<div class="entry-block" style="grid-column:1/-1;"><span class="lbl">Challenges / blockers</span>${nl2br(w.challenges)}</div>` : ''}
      </div>
      ${(w.linkedPaperIds && w.linkedPaperIds.length>0) ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Relates to paper(s)</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${w.linkedPaperIds.map(pid=>{
              const p = state.papers.find(x=>x.id===pid);

            }).join('')}
          </div>
        </div>
      ` : ''}
      ${(w.linkedProposalIds && w.linkedProposalIds.length>0) ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Contributes to proposal(s)</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${w.linkedProposalIds.map(prid=>{
              const pr = state.proposals.find(x=>x.id===prid);
              return pr ? `<span class="task-link stamp neutral" onclick="goToItem('proposal','${pr.id}','${w.studentId}')">${escapeHtml(pr.title)}</span>` : '';
            }).join('')}
          </div>
        </div>
      ` : ''}
      ${(w.linkedFabricationIds && w.linkedFabricationIds.length>0) ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Sample code(s) involved</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${w.linkedFabricationIds.map(fid=>{

            }).join('')}

      ${w.supervisorComment ? `

      <div class="entry-actions">
        ${canReview_(w) ? `<button class="small-btn" onclick="openReviewBox('${w.id}')">Review</button>` : (isSupervisorLike() && w.assignedReviewerId ? `<span class="entry-meta">Assigned to ${escapeHtml(w.assignedReviewerName)} for review</span>` : '')}

        ${canEdit ? `<button class="small-btn" onclick="openEditWeeklyModal('${w.id}')">Edit</button>` : ''}

function getMondayStr(){
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  const monday = new Date(d.setDate(diff));
  return monday.toISOString().slice(0,10);
}

function sampleStatus(s){
  if(s.resultsReceivedDate) return {label:'Completed', cls:'good'};

  return {label:'Awaiting Results', cls:'warn'};
}

          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${s.linkedFabricationIds.map(fid=>{
              const it = state.fabricationItems.find(x=>x.id===fid);
              return it ? `<span class="task-link stamp neutral" onclick="goToItem('fabrication','${it.id}','${s.studentId}')">${escapeHtml(fabricationLabel(it))}</span>` : '';
            }).join('')}
          </div>
        </div>
      ` : ''}
      <div class="entry-grid">
        <div class="entry-block"><span class="lbl">Submitted</span>${fmtDate(s.submittedDate)}</div>
        <div class="entry-block"><span class="lbl">Expected by</span>${s.expectedDate ? fmtDate(s.expectedDate) : '—'}</div>

      </div>

          <span class="lbl">Results / data entry history</span>
          <div style="display:flex; flex-direction:column; gap:3px; margin-top:4px;">

          </div>

      ${locked ? `<div class="entry-meta" style="margin-top:10px;">Approved submissions are locked — you can still log results, but contact your supervisor to change the submission details.</div>` : ''}
      <div class="entry-actions">
        ${canEditSubmission ? `<button class="small-btn" onclick="openEditSampleModal('${s.id}')">Edit submission</button>` : ''}

        ${canMarkResults && s.resultsReceivedDate ? `<button class="small-btn" onclick="openReceiveModal('${s.id}')">${s.dataLink ? 'Edit data entry' : 'Add data entry'}</button>` : ''}
        ${canReview_(s) ? `<button class="small-btn" onclick="openSampleReviewBox('${s.id}')">Review</button>` : (isSupervisorLike() && s.assignedReviewerId ? `<span class="entry-meta">Assigned to ${escapeHtml(s.assignedReviewerName)} for review</span>` : '')}

      </div>
      <div id="sampleReviewSlot-${s.id}"></div>
    </div>
  `;

/* ============================ RESULTS ANALYSIS ============================ */
// Sits between Characterization and Paper Pipeline in the actual research
// flow: samples get tested (Characterization), then the resulting data
// gets analyzed and interpreted here, before it feeds into a paper.
const ANALYSIS_STATUSES = { not_started:{label:'Not Started', cls:'neutral'}, in_progress:{label:'In Progress', cls:'warn'}, completed:{label:'Completed', cls:'good'} };
function analysisApprovalMap(){
  return {
    pending: { label:'Pending Approval', cls:'warn' },
    approved: { label:'Approved', cls:'good' },
    changes_requested: { label:'Changes Requested', cls:'bad' }
  };
}
function viewResultsAnalysis(){
  const fullList = scopedList(state.resultsAnalysis);
  let list = fullList.slice().sort((a,b)=> (b.lastUpdate||'').localeCompare(a.lastUpdate||''));
  if(state.filterAnalysisStatus && state.filterAnalysisStatus !== 'all'){
    list = list.filter(a => a.approvalStatus === state.filterAnalysisStatus);
  }
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Results Analysis</div>
        <div class="view-sub">Interpreting the data that came back — linked to the sample codes, characterization runs, papers, and thesis chapters it feeds into.</div>
      </div>
      <button class="action-btn" onclick="openAnalysisModal()">+ Log analysis</button>
    </div>
    ${supervisorFilterBar()}
    ${sectionPieAndFilter(fullList, 'approvalStatus', state.filterAnalysisStatus, 'setFilterAnalysisStatus')}
    ${list.length===0 ? emptyState('Nothing logged yet', 'Log an analysis to track interpreting results from a characterization run, linked to whatever it supports.') : list.map((a,i)=>analysisCard(a,i,list.length)).join('')}
  `;
}
function setFilterAnalysisStatus(v){ state.filterAnalysisStatus = v; renderView(); }
function analysisCard(a, i, total){
  const isOwner = state.identity.role==='student' && a.studentId===state.identity.id;
  const canManage = isSupervisorLike();
  const locked = a.approvalStatus === 'approved' && isOwner;
  const canEdit = canManage || (isOwner && !locked);
  const st = analysisApprovalMap()[a.approvalStatus] || analysisApprovalMap().pending;
  const stt = ANALYSIS_STATUSES[a.status] || ANALYSIS_STATUSES.not_started;
  const overdue = a.targetDate && a.status!=='completed' && a.targetDate < todayStr();
  const linkedSamples = (a.linkedSampleIds||[]).map(id=>state.samples.find(x=>x.id===id)).filter(Boolean);
  const linkedFab = (a.linkedFabricationIds||[]).map(id=>state.fabricationItems.find(x=>x.id===id)).filter(Boolean);
  const linkedPapers = (a.linkedPaperIds||[]).map(id=>state.papers.find(x=>x.id===id)).filter(Boolean);
  const linkedThesis = a.linkedThesisId ? state.thesisPlans.find(x=>x.id===a.linkedThesisId) : null;
  return `
    <div class="entry-card cat-rose" id="item-analysis-${a.id}">
      <div class="entry-top">
        <div>
          <div class="entry-idx">RA${String(total-i).padStart(2,'0')} · ${escapeHtml(studentName(a.studentId))}</div>
          <div class="entry-title">${escapeHtml(a.title)}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="stamp ${st.cls}">${st.label}</span>
          <span class="stamp ${stt.cls}">${stt.label}</span>
          ${overdue ? `<span class="stamp bad">Overdue</span>` : ''}
        </div>
      </div>
      <div class="entry-grid">
        <div class="entry-block"><span class="lbl">Target date</span>${a.targetDate ? fmtDate(a.targetDate) : 'not set'}</div>
        ${a.notes ? `<div class="entry-block" style="grid-column:1/-1;"><span class="lbl">Analysis notes</span>${nl2br(a.notes)}</div>` : ''}
      </div>
      ${(a.targetDateHistory && a.targetDateHistory.length>0) ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Target date history</span>
          <div style="display:flex; flex-direction:column; gap:3px; margin-top:4px;">
            ${a.targetDateHistory.slice().reverse().map(h=>`<div class="entry-meta"><b>${escapeHtml(h.label||'')}</b> — ${fmtDate(h.changedAt)} — ${escapeHtml(h.changedBy)} set to ${fmtDate(h.to)}${h.from ? ' (was '+fmtDate(h.from)+')' : ''}</div>`).join('')}
          </div>
        </div>
      ` : ''}
      ${statusHistoryHtml(a)}
      ${linkedSamples.length>0 ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Characterization run(s)</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${linkedSamples.map(s=>`<span class="task-link stamp neutral" onclick="goToItem('sample','${s.id}','${a.studentId}')">${escapeHtml(s.sampleName)}</span>`).join('')}
          </div>
        </div>
      ` : ''}
      ${linkedFab.length>0 ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Sample code(s)</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${linkedFab.map(it=>`<span class="task-link stamp neutral" onclick="goToItem('fabrication','${it.id}','${a.studentId}')">${escapeHtml(fabricationLabel(it))}</span>`).join('')}
          </div>
        </div>
      ` : ''}
      ${linkedPapers.length>0 ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Paper(s)</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
            ${linkedPapers.map(p=>`<span class="task-link stamp neutral" onclick="goToItem('paper','${p.id}','${a.studentId}')">${escapeHtml(p.title)}</span>`).join('')}
          </div>
        </div>
      ` : ''}
      ${linkedThesis ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Thesis plan</span>
          <span class="task-link stamp neutral" onclick="goToItem('thesis','${linkedThesis.id}','${a.studentId}')">${escapeHtml(linkedThesis.title)}</span>
        </div>
      ` : ''}
      ${a.supervisorNote ? `<div class="comment-box"><span class="lbl">${a.reviewedByName ? `Note from ${escapeHtml(a.reviewedByName)} (${escapeHtml(a.reviewedByRole)}) on ${escapeHtml(a.reviewedAt||'')}` : 'Supervisor note'}</span><div class="comment-existing">${nl2br(a.supervisorNote)}</div></div>` : ''}
      ${reviewHistoryHtml(a)}
      ${editHistoryHtml(a)}
      ${createdByHtml(a)}
      ${locked ? `<div class="entry-meta" style="margin-top:10px;">Approved entries are locked — contact your supervisor if this needs to change.</div>` : ''}
      <div class="entry-actions">
        ${(canManage || isOwner) ? `
          <select class="small-btn" style="padding-right:6px;" onchange="setAnalysisStatus('${a.id}', this.value)">
            <option value="not_started" ${a.status==='not_started'?'selected':''}>Not Started</option>
            <option value="in_progress" ${a.status==='in_progress'?'selected':''}>In Progress</option>
            <option value="completed" ${a.status==='completed'?'selected':''}>Completed</option>
          </select>
        ` : ''}
        ${canReview_(a) ? `<button class="small-btn" onclick="openAnalysisReviewBox('${a.id}')">Review</button>` : (isSupervisorLike() && a.assignedReviewerId ? `<span class="entry-meta">Assigned to ${escapeHtml(a.assignedReviewerName)} for review</span>` : '')}
        ${(isSupervisorLike() && a.approvalStatus==='approved') ? `<button class="small-btn" onclick="addAdditionalComment('analysis','${a.id}')">+ Add comment</button>` : ''}
        ${canEdit ? `<button class="small-btn" onclick="openEditAnalysisModal('${a.id}')">Edit</button>` : ''}
        ${isTrueSupervisor() ? `<button class="small-btn danger" onclick="deleteAnalysis('${a.id}')">Delete</button>` : ''}
      </div>
      <div id="analysisReviewSlot-${a.id}"></div>
    </div>
  `;
}
async function setAnalysisStatus(id, status){
  const a = state.resultsAnalysis.find(x=>x.id===id);
  if(!a) return;
  pushStatusHistory_(a, a.status, status);
  a.status = status;
  a.lastUpdate = todayStr();
  await saveCollection('results-analysis', state.resultsAnalysis);
  renderView();
}
function analysisFormFields(a){
  a = a || {};
  const studentId = a.studentId || (state.identity.role==='student' ? state.identity.id : (state.filterStudentId!=='all' ? state.filterStudentId : visibleStudentsForIdentity()[0]?.id));
  const mySamples = state.samples.filter(s=>s.studentId===studentId);
  const myFab = state.fabricationItems.filter(it=>it.studentId===studentId);
  const myPapers = state.papers.filter(p=>p.studentId===studentId);
  const myThesis = state.thesisPlans.find(tp=>tp.studentId===studentId);
  const linkedSamples = a.linkedSampleIds || [];
  const linkedFab = a.linkedFabricationIds || [];
  const linkedPapers = a.linkedPaperIds || [];
  return `
    <label class="field-label">Title</label>
    <input class="text-input" id="f_anTitle" value="${escapeHtml(a.title||'')}" placeholder="e.g. XRD Rietveld refinement for batch 3">
    <label class="field-label">Target date (optional)</label>
    <input type="date" class="text-input" id="f_anTargetDate" value="${a.targetDate||''}">
    ${mySamples.length>0 ? `
      <label class="field-label">Characterization run(s) this analyzes (optional)</label>
      <select class="text-input" id="f_anSamples" multiple size="${Math.min(4, Math.max(2, mySamples.length))}">
        ${mySamples.map(s=>`<option value="${s.id}" ${linkedSamples.includes(s.id)?'selected':''}>${escapeHtml(s.sampleName)} — ${escapeHtml(s.technique)}</option>`).join('')}
      </select>
    ` : ''}
    ${myFab.length>0 ? `
      <label class="field-label">Sample code(s) involved (optional)</label>
      <select class="text-input" id="f_anFab" multiple size="${Math.min(4, Math.max(2, myFab.length))}">
        ${myFab.map(it=>`<option value="${it.id}" ${linkedFab.includes(it.id)?'selected':''}>${escapeHtml(fabricationLabel(it))}</option>`).join('')}
      </select>
    ` : ''}
    ${myPapers.length>0 ? `
      <label class="field-label">Paper(s) this feeds into (optional)</label>
      <select class="text-input" id="f_anPapers" multiple size="${Math.min(4, Math.max(2, myPapers.length))}">
        ${myPapers.map(p=>`<option value="${p.id}" ${linkedPapers.includes(p.id)?'selected':''}>${escapeHtml(p.title)}</option>`).join('')}
      </select>
    ` : ''}
    ${myThesis ? `
      <label class="field-label">Link to thesis plan (optional)</label>
      <select class="text-input" id="f_anThesis">
        <option value="">Not linked</option>
        <option value="${myThesis.id}" ${a.linkedThesisId===myThesis.id?'selected':''}>${escapeHtml(myThesis.title)}</option>
      </select>
    ` : ''}
    <div class="view-sub" style="margin-top:4px;">Hold Ctrl (or ⌘ on Mac) to select more than one in a list.</div>
    <label class="field-label">Analysis notes (optional)</label>
    <textarea class="text-input" id="f_anNotes" rows="3" placeholder="Interpretation, key observations, conclusions so far">${escapeHtml(a.notes||'')}</textarea>
  `;
}
function openAnalysisModal(){
  showModal('Results Analysis', analysisFormFields(), submitAnalysis);
}
async function submitAnalysis(){
  const title = document.getElementById('f_anTitle').value.trim();
  if(!title){ alert('Please add a title.'); return; }
  const studentId = state.identity.role==='student' ? state.identity.id : (state.filterStudentId!=='all' ? state.filterStudentId : visibleStudentsForIdentity()[0]?.id);
  if(!studentId){ alert('Add a research scholar first.'); return; }
  const samplesSelect = document.getElementById('f_anSamples');
  const fabSelect = document.getElementById('f_anFab');
  const papersSelect = document.getElementById('f_anPapers');
  const thesisSelect = document.getElementById('f_anThesis');
  const newAnalysis = {
    id: uid('an'), studentId, title,
    targetDate: document.getElementById('f_anTargetDate').value,
    linkedSampleIds: samplesSelect ? Array.from(samplesSelect.selectedOptions).map(el=>el.value) : [],
    linkedFabricationIds: fabSelect ? Array.from(fabSelect.selectedOptions).map(el=>el.value) : [],
    linkedPaperIds: papersSelect ? Array.from(papersSelect.selectedOptions).map(el=>el.value) : [],
    linkedThesisId: thesisSelect ? (thesisSelect.value || null) : null,
    notes: document.getElementById('f_anNotes').value.trim(),
    status: 'not_started',
    approvalStatus: isSupervisorLike() ? 'approved' : 'pending', supervisorNote:'', lastUpdate: todayStr()
  };
  state.resultsAnalysis.push(newAnalysis);
  await saveCollection('results-analysis', state.resultsAnalysis);
  if(!isSupervisorLike()){
    apiNotify('analysisSubmitted', { studentId, title });
  } else {
    logStaffCreate_(newAnalysis, title, 'analysis');
  }
  closeModal(); renderView();
}
function openEditAnalysisModal(id){
  const a = state.resultsAnalysis.find(x=>x.id===id);
  showModal('Results Analysis', analysisFormFields(a) + (!isSupervisorLike() ? `<div class="view-sub" style="margin-top:8px;">Saving will send this back for approval.</div>` : ''), ()=>submitEditAnalysis(id));
}
async function submitEditAnalysis(id){
  const a = state.resultsAnalysis.find(x=>x.id===id);
  const title = document.getElementById('f_anTitle').value.trim();
  if(!title){ alert('Please add a title.'); return; }
  const samplesSelect = document.getElementById('f_anSamples');
  const fabSelect = document.getElementById('f_anFab');
  const papersSelect = document.getElementById('f_anPapers');
  const thesisSelect = document.getElementById('f_anThesis');
  a.title = title;
  const newAnTargetDate = document.getElementById('f_anTargetDate').value;
  if(newAnTargetDate !== (a.targetDate || '')){
    if(!a.targetDateHistory) a.targetDateHistory = [];
    a.targetDateHistory.push({ from: a.targetDate || null, to: newAnTargetDate, changedBy: state.identity.name, changedAt: todayStr(), label: targetDateChangeLabel(a.targetDateHistory.length) });
  }
  a.targetDate = newAnTargetDate;
  a.linkedSampleIds = samplesSelect ? Array.from(samplesSelect.selectedOptions).map(el=>el.value) : (a.linkedSampleIds||[]);
  a.linkedFabricationIds = fabSelect ? Array.from(fabSelect.selectedOptions).map(el=>el.value) : (a.linkedFabricationIds||[]);
  a.linkedPaperIds = papersSelect ? Array.from(papersSelect.selectedOptions).map(el=>el.value) : (a.linkedPaperIds||[]);
  a.linkedThesisId = thesisSelect ? (thesisSelect.value || null) : a.linkedThesisId;
  a.notes = document.getElementById('f_anNotes').value.trim();
  a.lastUpdate = todayStr();
  if(!isSupervisorLike()){
    a.approvalStatus = 'pending';
    await saveCollection('results-analysis', state.resultsAnalysis);
    apiNotify('analysisSubmitted', { studentId: a.studentId, title: a.title });
  } else {
    logStaffEdit_(a, a.title, 'analysis');
    await saveCollection('results-analysis', state.resultsAnalysis);
  }
  closeModal(); renderView();
}
function openAnalysisReviewBox(id){
  const a = state.resultsAnalysis.find(x=>x.id===id);
  document.getElementById('analysisReviewSlot-'+id).innerHTML = `
    <div class="comment-box">
      <span class="lbl">Note (required to request changes)</span>
      <textarea id="analysisReviewInput-${id}">${escapeHtml(a.supervisorNote || '')}</textarea>
      <div class="entry-actions">
        <button class="small-btn" onclick="reviewAnalysis('${id}','approved')">Approve</button>
        <button class="small-btn danger" onclick="reviewAnalysis('${id}','changes_requested')">Request changes</button>
      </div>
    </div>`;
}
async function reviewAnalysis(id, decision){
  const a = state.resultsAnalysis.find(x=>x.id===id);
  const val = document.getElementById('analysisReviewInput-'+id).value.trim();
  if(decision==='changes_requested' && !val){ alert('Please add a note explaining what needs to change.'); return; }
  const reviewer = reviewerIdentity(a.studentId);
  pushReviewHistory_(a, decision, val);
  a.supervisorNote = val;
  a.approvalStatus = decision;
  a.reviewedByName = reviewer.name;
  a.reviewedByRole = reviewer.roleLabel;
  a.reviewedAt = nowIST();
  await saveCollection('results-analysis', state.resultsAnalysis);
  apiNotify('analysisReviewed', { studentId: a.studentId, title: a.title, decision, note: val, reviewedByName: reviewer.name, reviewedByRole: reviewer.roleLabel });
  renderView();
}
async function deleteAnalysis(id){
  const a = state.resultsAnalysis.find(x=>x.id===id);
  if(!a) return;
  const ok = await deleteEntryWithReason('analysis', state.resultsAnalysis, 'results-analysis', id, a.title, a.studentId);
  if(ok) renderView();
}

/* ============================ PAPERS ============================ */
function stageStampClass(stage){
  if(stage==='Published') return 'good';
  if(stage==='Accepted') return 'good';
  if(stage==='Revisions Requested') return 'warn';
  if(stage==='Under Review' || stage==='Submitted') return 'neutral';
  return 'neutral';
}
function viewPapers(){
  const fullList = scopedList(state.papers);
  let list = fullList.slice().sort((a,b)=> (b.lastUpdate||'').localeCompare(a.lastUpdate||''));
  if(state.filterPaperStatus && state.filterPaperStatus !== 'all'){
    list = list.filter(p => (state.filterPaperStatus==='pending' ? !!p.pendingStage : !p.pendingStage));
  }
  const paperCounts = { approved:0, pending:0, changes_requested:0 };
  fullList.forEach(p=>{ if(p.pendingStage) paperCounts.pending++; else paperCounts.approved++; });
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Paper Pipeline</div>
        <div class="view-sub">Track manuscripts from planning through to publication, with draft and reference links.</div>
      </div>
      <button class="action-btn" onclick="openPaperModal()">+ Add New Paper Plan</button>
    </div>
    ${supervisorFilterBar()}
    <div class="two-col-panels" style="margin-bottom:20px; align-items:center;">
      <div class="entry-card compact-card" style="padding:16px 20px;">${renderStatusPie(paperCounts, 86)}</div>
      <div class="filter-row" style="margin-bottom:0;">
        <select onchange="setFilterPaperStatus(this.value)">
          <option value="all" ${state.filterPaperStatus==='all'?'selected':''}>All papers</option>
          <option value="approved" ${state.filterPaperStatus==='approved'?'selected':''}>Confirmed stage</option>
          <option value="pending" ${state.filterPaperStatus==='pending'?'selected':''}>Stage change pending</option>
        </select>
      </div>
    </div>
    ${list.length===0 ? emptyState('No papers tracked yet', 'Add a paper to start tracking its progress toward publication.') : list.map((p,i)=>paperCard(p,i,list.length)).join('')}
  `;
}
function setFilterPaperStatus(v){ state.filterPaperStatus = v; renderView(); }
function paperCard(p, i, total){
  const isOwner = state.identity.role==='student' && p.studentId===state.identity.id;
  const canManage = isSupervisorLike();
  const locked = p.stage === 'Published' && isOwner;
  const canEdit = canManage || (isOwner && !locked);
  const hasPending = !!p.pendingStage;
  const hasPendingDetails = !!p.pendingDetails;
  const refLinks = p.referenceLinks || [];
  const overdue = p.targetDate && p.stage!=='Published' && p.targetDate < todayStr();
  return `
    <div class="entry-card cat-purple" id="item-paper-${p.id}">
      <div class="entry-top">
        <div>
          <div class="entry-idx">P${String(total-i).padStart(2,'0')} · ${escapeHtml(studentName(p.studentId))}</div>
          <div class="entry-title">${escapeHtml(p.title)}</div>
          <div class="entry-meta">${escapeHtml(p.targetJournal || 'Target journal not set')}${p.targetDate ? ` · Target: ${fmtDate(p.targetDate)}` : ''}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="stamp ${stageStampClass(p.stage)}">${escapeHtml(p.stage)}</span>
          ${hasPending ? `<span class="stamp warn">Proposed: ${escapeHtml(p.pendingStage)}</span>` : ''}
          ${hasPendingDetails ? `<span class="stamp warn">Detail change proposed</span>` : ''}
          ${overdue ? `<span class="stamp bad">Overdue</span>` : ''}
        </div>
      </div>
      ${hasPendingDetails ? `
        <div class="comment-box">
          <span class="lbl">Requested changes</span>
          <div class="entry-meta" style="margin-top:2px;">
            ${p.pendingDetails.targetJournal !== (p.targetJournal||'') ? `Journal: "${escapeHtml(p.targetJournal||'—')}" → <b>"${escapeHtml(p.pendingDetails.targetJournal||'—')}"</b><br>` : ''}
            ${p.pendingDetails.targetDate !== (p.targetDate||'') ? `${escapeHtml((p.detailsHistory||[]).slice().reverse().find(h=>h.status==='pending' && h.dateLabel)?.dateLabel || 'Target date')}: ${p.targetDate?fmtDate(p.targetDate):'not set'} → <b>${p.pendingDetails.targetDate?fmtDate(p.pendingDetails.targetDate):'not set'}</b><br>` : ''}
            ${p.pendingDetails.manuscriptLink !== (p.manuscriptLink||'') ? `Manuscript link updated<br>` : ''}
            ${p.pendingDetails.notes !== (p.notes||'') ? `Notes updated` : ''}
          </div>
          ${canReview_(p) ? `
            <div class="entry-actions" style="margin-top:8px;">
              <button class="small-btn" onclick="approvePendingDetails('${p.id}')">Approve changes</button>
              <button class="small-btn danger" onclick="rejectPendingDetails('${p.id}')">Reject changes</button>
            </div>
          ` : isOwner ? `<div class="entry-meta" style="margin-top:6px;">Waiting on your supervisor to approve these changes.</div>` : `<div class="entry-meta" style="margin-top:6px;">Assigned to ${escapeHtml(p.assignedReviewerName)} for review.</div>`}
        </div>
      ` : ''}
      ${p.notes ? `<div class="entry-block"><span class="lbl">Notes</span>${nl2br(p.notes)}</div>` : ''}
      ${p.manuscriptLink ? `<div class="entry-block" style="margin-top:8px;"><span class="lbl">Manuscript / draft</span><a href="${escapeHtml(p.manuscriptLink)}" target="_blank" rel="noopener">Open draft ↗</a></div>` : ''}
      ${(()=>{
        const supportingSamples = state.fabricationItems.filter(it => (it.linkedPaperIds||[]).includes(p.id));
        return supportingSamples.length>0 ? `
          <div class="entry-block" style="margin-top:8px;">
            <span class="lbl">Supporting sample code(s)</span>
            <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
              ${supportingSamples.map(it=>`<span class="task-link stamp neutral" onclick="goToItem('fabrication','${it.id}','${p.studentId}')">${escapeHtml(fabricationLabel(it))}</span>`).join('')}
            </div>
          </div>
        ` : '';
      })()}
      ${(p.detailsHistory && p.detailsHistory.length>0) ? `
        <div class="entry-block" style="margin-top:8px;">
          <span class="lbl">Change history</span>
          <div style="display:flex; flex-direction:column; gap:3px; margin-top:4px;">
            ${p.detailsHistory.slice().reverse().map(h=>`
              <div class="entry-meta">${fmtDate(h.changedAt)} — ${escapeHtml(h.changedBy)}: ${escapeHtml(h.summary)} <span class="stamp ${h.status==='approved'||h.status==='applied'?'good':h.status==='rejected'?'bad':'warn'}" style="padding:1px 6px; font-size:10px; margin-left:4px;">${h.status}</span></div>
            `).join('')}
          </div>
        </div>
      ` : ''}
      ${statusHistoryHtml(p)}
      <div class="entry-block" style="margin-top:8px;">
        <span class="lbl">Reference links <span style="text-transform:none; font-weight:400;">(reading, citations, related work)</span></span>
        ${refLinks.length===0 ? `<span class="entry-meta">No reference links added yet.</span>` : `
          <ul style="margin:4px 0 0; padding-left:18px;">
            ${refLinks.map(l=>`
              <li style="margin-bottom:3px; font-size:13.5px;">
                <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label || l.url)}</a>
                ${canEdit ? `<button class="small-btn" style="padding:1px 7px; font-size:11px; margin-left:6px;" onclick="deleteReferenceLink('${p.id}','${l.id}')">Remove</button>` : ''}
              </li>
            `).join('')}
          </ul>
        `}
      </div>
      ${p.supervisorNote ? `<div class="comment-box"><span class="lbl">${p.reviewedByName ? `Note from ${escapeHtml(p.reviewedByName)} (${escapeHtml(p.reviewedByRole)}) on ${escapeHtml(p.reviewedAt||'')}` : 'Supervisor note'}</span><div class="comment-existing">${nl2br(p.supervisorNote)}</div></div>` : ''}
      ${reviewHistoryHtml(p)}
      ${editHistoryHtml(p)}
      ${createdByHtml(p)}
      <div class="entry-meta" style="margin-top:8px;">Last updated ${fmtDate(p.lastUpdate)}</div>
      ${locked ? `<div class="entry-meta" style="margin-top:6px;">Published papers are locked — contact your supervisor for any changes.</div>` : ''}

async function requestStageChange(id, newStage){

  if(isSupervisorLike()){

    p.lastUpdate = todayStr();

    p.pendingStage = newStage;
    p.lastUpdate = todayStr();

// Any detail a scholar changes here — journal, target date, manuscript link,
// or notes — is bundled into ONE pending proposal the supervisor approves or
// rejects as a whole, exactly like stage changes already work. Nothing is
// applied until they decide. The supervisor's own edits still apply
// immediately. Every change, decided or not, is recorded in history.
async function saveEditPaperDetails(id){
  const p = state.papers.find(x=>x.id===id);
  const newJournal = document.getElementById('f_editJournal').value.trim();
  const newDate = document.getElementById('f_editPaperTargetDate').value;
  const newLink = document.getElementById('f_editManuscriptLink').value.trim();
  const newNotes = document.getElementById('f_editNotes').value.trim();
  if(!p.detailsHistory) p.detailsHistory = [];

  const changed = newJournal !== (p.targetJournal||'') || newDate !== (p.targetDate||'') || newLink !== (p.manuscriptLink||'') || newNotes !== (p.notes||'');
  if(!changed){ closeModal(); return; }

  const proposedValues = { targetJournal: newJournal, targetDate: newDate, manuscriptLink: newLink, notes: newNotes };
  const wasAlreadyEstablished = !!(p.targetJournal || p.targetDate || p.manuscriptLink);

  // If the target date is part of this change, work out which revision this
  // is ("First target" / "First revised target" / "Second revised target"...)
  // by counting only the PRIOR history entries that also touched the date.
  let dateLabel = null;
  if(newDate !== (p.targetDate||'')){
    const priorDateChanges = p.detailsHistory.filter(h=>h.dateLabel).length;
    dateLabel = targetDateChangeLabel(priorDateChanges);
  }
  const summary = summarizePaperDetailChange_(p, proposedValues, dateLabel);

  if(!isSupervisorLike() && wasAlreadyEstablished){
    p.pendingDetails = proposedValues;
    p.detailsHistory.push({ changedBy: state.identity.name, changedAt: todayStr(), status: 'pending', dateLabel, summary });
    apiNotify('paperDetailsProposed', { studentId: p.studentId, title: p.title, summary });
  } else {
    p.detailsHistory.push({ changedBy: state.identity.name, changedAt: todayStr(), status: 'applied', dateLabel, summary });
    Object.assign(p, proposedValues);
    if(isSupervisorLike() && wasAlreadyEstablished){
      const editor = reviewerIdentity(p.studentId);
      apiNotify('workItemEdited', { studentId: p.studentId, title: p.title, type: 'paper', editedByName: editor.name, editedByRole: editor.roleLabel, commenterId: state.identity.id });
    }
  }
  p.lastUpdate = todayStr();
  await saveCollection('papers', state.papers);
  closeModal(); renderView();
}
function summarizePaperDetailChange_(p, next, dateLabel){
  const parts = [];
  if(next.targetJournal !== (p.targetJournal||'')) parts.push(`journal → "${next.targetJournal||'—'}"`);
  if(next.targetDate !== (p.targetDate||'')) parts.push(`${dateLabel||'target date'} → ${next.targetDate?fmtDate(next.targetDate):'not set'}`);
  if(next.manuscriptLink !== (p.manuscriptLink||'')) parts.push(`manuscript link updated`);
  if(next.notes !== (p.notes||'')) parts.push(`notes updated`);
  return parts.join(', ') || 'details updated';
}
async function approvePendingDetails(id){
  const p = state.papers.find(x=>x.id===id);
  if(!p.pendingDetails) return;
  const reviewer = reviewerIdentity(p.studentId);
  const entry = (p.detailsHistory||[]).slice().reverse().find(h=>h.status==='pending');
  if(entry) entry.status = 'approved';
  pushReviewHistory_(p, 'approved', entry ? entry.summary : 'Details change approved');
  Object.assign(p, p.pendingDetails);
  p.pendingDetails = null;
  p.lastUpdate = todayStr();
  p.reviewedByName = reviewer.name;
  p.reviewedByRole = reviewer.roleLabel;
  p.reviewedAt = nowIST();
  await saveCollection('papers', state.papers);
  apiNotify('paperDetailsDecided', { studentId: p.studentId, title: p.title, decision: 'approved', reviewedByName: reviewer.name, reviewedByRole: reviewer.roleLabel });
  renderView();
}
async function rejectPendingDetails(id){

  if(!p.pendingDetails) return;

  p.pendingDetails = null;

}

  const c = state.conferences.find(x=>x.id===id);
  const val = document.getElementById('conferenceReviewInput-'+id).value.trim();
  if(decision==='changes_requested' && !val){ alert('Please add a note explaining what needs to change.'); return; }
  const reviewer = reviewerIdentity(c.studentId);
  pushReviewHistory_(c, decision, val);
  c.supervisorNote = val;
  c.approvalStatus = decision;
  c.reviewedByName = reviewer.name;
  c.reviewedByRole = reviewer.roleLabel;
  c.reviewedAt = nowIST();
  await saveCollection('conferences', state.conferences);
  apiNotify('conferenceReviewed', { studentId: c.studentId, eventName: c.eventName, decision, note: val, reviewedByName: reviewer.name, reviewedByRole: reviewer.roleLabel });
  renderView();
}
async function deleteConference(id){
  const c = state.conferences.find(x=>x.id===id);
  if(!c) return;
  const ok = await deleteEntryWithReason('conference', state.conferences, 'conferences', id, c.eventName, c.studentId);
  if(ok) renderView();
}

/* ============================ MEETINGS & PRESENTATIONS ============================ */
const MEETING_STATUS = {
  proposed: { label:'Proposed', cls:'warn' },
  confirmed: { label:'Confirmed', cls:'neutral' },
  completed: { label:'Completed', cls:'good' },
  cancelled: { label:'Cancelled', cls:'bad' }
};
function meetingTypeFilterBar(){
  return `
    <select onchange="setFilterMeetingType(this.value)" style="margin-left:8px;">
      <option value="all" ${state.filterMeetingType==='all'?'selected':''}>All types</option>
      ${MEETING_TYPES.map(t=>`<option value="${t}" ${state.filterMeetingType===t?'selected':''}>${t}</option>`).join('')}
    </select>
  `;
}
function setFilterMeetingType(v){ state.filterMeetingType = v; renderView(); }

function viewMeetings(){
  let list = scopedList(state.meetings);
  if(state.filterMeetingType !== 'all') list = list.filter(m=>m.type===state.filterMeetingType);
  list = list.slice().sort((a,b)=> b.plannedDate.localeCompare(a.plannedDate));
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Meetings</div>
        <div class="view-sub">Weekly reviews, monthly presentations, and topic discussions — planned and tracked in one place.</div>
      </div>
      <button class="action-btn" onclick="openMeetingModal()">+ Schedule</button>
    </div>
    <div class="filter-row">${supervisorFilterBar()}${meetingTypeFilterBar()}</div>
    ${list.length===0 ? emptyState('Nothing scheduled yet', 'Schedule a weekly review, monthly presentation, or topic discussion to start tracking it.') : list.map((m,i)=>meetingCard(m,i,list.length)).join('')}
  `;
}
function meetingCard(m, i, total){
  const isOwner = state.identity.role==='student' && m.studentId===state.identity.id;
  const canManage = isSupervisorLike();
  const canDelete = isTrueSupervisor();
  const st = MEETING_STATUS[m.status] || MEETING_STATUS.proposed;
  const isPast = m.plannedDate < todayStr();
  const minutes = m.minutes || [];
  // Minutes/feedback can only be added once the meeting has been approved
  // (no longer just "proposed") and its date has actually arrived — this is
  // a record of what happened, not a place for pre-meeting notes. Once
  // approved, both the scholar and the supervisor can add points here.
  const canAddMinutes = (canManage || isOwner) && m.status !== 'proposed' && m.plannedDate <= todayStr();
  return `
    <div class="entry-card cat-indigo" id="item-meeting-${m.id}">
      <div class="entry-top">
        <div>
          <div class="entry-idx">M${String(total-i).padStart(2,'0')} · ${escapeHtml(studentName(m.studentId))}</div>
          <div class="entry-title">${escapeHtml(m.title)}</div>
          <div class="entry-meta">${escapeHtml(m.type)} · ${fmtDate(m.plannedDate)}${(m.startTime||m.endTime||m.plannedTime) ? ' · '+escapeHtml(fmtTimeRange(m.startTime||m.plannedTime, m.endTime)) : ''}${isPast && (m.status==='proposed'||m.status==='confirmed') ? ' · past due' : ''}${m.confirmedByName ? ' · Confirmed by '+escapeHtml(m.confirmedByName)+' ('+escapeHtml(m.confirmedByRole)+') on '+escapeHtml(m.confirmedAt||'') : ''}</div>
        </div>
        <span class="stamp ${st.cls}">${st.label}</span>
      </div>
      ${m.agenda ? `<div class="entry-block"><span class="lbl">Agenda / discussion points</span>${nl2br(m.agenda)}</div>` : ''}
      ${m.outcomeNotes ? `<div class="comment-box"><span class="lbl">${m.status==='cancelled'?'Reason':'Outcome summary'}</span><div class="comment-existing">${nl2br(m.outcomeNotes)}</div></div>` : ''}
      ${(m.status!=='proposed') ? `
        <div class="entry-block" style="margin-top:10px;">
          <span class="lbl">Minutes / feedback${minutes.length>0 ? ` (${minutes.length})` : ''}</span>
          ${minutes.length===0 ? `<div class="entry-meta" style="margin-top:2px;">No points recorded yet.</div>` : `
            <ul style="margin:6px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:6px;">
              ${minutes.map(pt=>`
                <li style="font-size:13.5px; line-height:1.5;">
                  ${escapeHtml(pt.text)}
                  <div class="entry-meta">${fmtDate(pt.addedAt)} — ${escapeHtml(pt.addedBy)}${(canManage || pt.addedById===state.identity.id) ? ` · <span class="task-link" onclick="deleteMeetingMinute('${m.id}','${pt.id}')">Remove</span>` : ''}</div>
                </li>
              `).join('')}
            </ul>
          `}
          ${canAddMinutes ? `<div class="entry-actions" style="margin-top:8px;"><button class="small-btn" onclick="openAddMeetingMinuteModal('${m.id}')">+ Add point</button></div>` :
            (m.status!=='proposed' && m.plannedDate>todayStr() && (canManage||isOwner)) ? `<div class="entry-meta" style="margin-top:6px;">Minutes can be added once the meeting date arrives.</div>` : ''}
        </div>
      ` : ''}
      ${isOwner && m.status!=='proposed' ? `<div class="entry-meta" style="margin-top:6px;">Confirmed items can only be changed or cancelled by your supervisor.</div>` : ''}
      <div class="entry-actions">
        ${canManage && m.status==='proposed' ? `<button class="small-btn" onclick="openConfirmMeetingModal('${m.id}')">Confirm</button>` : ''}
        ${canManage && (m.status==='proposed'||m.status==='confirmed') ? `<button class="small-btn" onclick="openCompleteMeetingModal('${m.id}')">Mark completed</button>` : ''}
        ${canManage && (m.status==='proposed'||m.status==='confirmed') ? `<button class="small-btn danger" onclick="openCancelMeetingModal('${m.id}')">Cancel</button>` : ''}
        ${canDelete ? `<button class="small-btn danger" onclick="deleteMeeting('${m.id}')">Delete</button>` : ''}
      </div>
    </div>
  `;
}
function openAddMeetingMinuteModal(id){
  showModal('Add minute / feedback point', `
    <label class="field-label">Point</label>
    <textarea class="text-input" id="f_minuteText" rows="2" placeholder="e.g. Agreed to repeat the XRD scan with a slower step rate before the next review."></textarea>
  `, ()=>submitAddMeetingMinute(id));
}
async function submitAddMeetingMinute(id){
  const text = document.getElementById('f_minuteText').value.trim();
  if(!text){ alert('Please add a point.'); return; }
  const m = state.meetings.find(x=>x.id===id);
  if(!m.minutes) m.minutes = [];
  m.minutes.push({ id: uid('min'), text, addedBy: state.identity.name, addedById: state.identity.id, addedAt: todayStr() });
  m.lastUpdate = todayStr();
  await saveCollection('meetings', state.meetings);
  closeModal(); renderView();
}
async function deleteMeetingMinute(id, minuteId){
  if(!confirm('Remove this point?')) return;
  const m = state.meetings.find(x=>x.id===id);
  m.minutes = (m.minutes||[]).filter(pt=>pt.id!==minuteId);
  m.lastUpdate = todayStr();
  await saveCollection('meetings', state.meetings);
  renderView();
}
function openMeetingModal(){
  showModal('Meetings', `
    <label class="field-label">Type</label>
    <select class="text-input" id="f_meetType">${MEETING_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
    <label class="field-label">Title / topic</label>
    <input class="text-input" id="f_meetTitle" placeholder="e.g. March group meeting presentation">
    <label class="field-label">Planned date</label>
    <input type="date" class="text-input" id="f_meetDate" value="${todayStr()}">
    <div class="two-col">
      <div><label class="field-label">From (optional)</label>
        <input type="time" class="text-input" id="f_meetStartTime">
      </div>
      <div><label class="field-label">To (optional)</label>
        <input type="time" class="text-input" id="f_meetEndTime">
      </div>
    </div>
    <label class="field-label">Agenda / discussion points (optional)</label>
    <textarea class="text-input" id="f_meetAgenda" rows="3" placeholder="What do you want to cover or discuss?"></textarea>
  `, submitMeeting);
}
async function submitMeeting(){
  const type = document.getElementById('f_meetType').value;
  const title = document.getElementById('f_meetTitle').value.trim();
  const plannedDate = document.getElementById('f_meetDate').value;
  const startTime = document.getElementById('f_meetStartTime').value;
  const endTime = document.getElementById('f_meetEndTime').value;
  const agenda = document.getElementById('f_meetAgenda').value.trim();
  if(!title || !plannedDate){ alert('Please add a title and planned date.'); return; }
  if(startTime && endTime && endTime <= startTime){ alert('The "To" time must be after the "From" time.'); return; }
  const studentId = state.identity.role==='student' ? state.identity.id : (state.filterStudentId!=='all' ? state.filterStudentId : visibleStudentsForIdentity()[0]?.id);
  if(!studentId){ alert('Add a research scholar first.'); return; }
  state.meetings.push({
    id: uid('mtg'), studentId, type, title, plannedDate, startTime, endTime, agenda, outcomeNotes:'', minutes:[],
    status: isSupervisorLike() ? 'confirmed' : 'proposed',
    lastUpdate: todayStr()
  });
  await saveCollection('meetings', state.meetings);
  closeModal(); renderView();
}
// Confirming a request isn't just a one-click approval — the supervisor may
// only be free at a different time than what the scholar first proposed, so
// this lets them adjust the date/time as part of approving it.
function openConfirmMeetingModal(id){
  const m = state.meetings.find(x=>x.id===id);
  showModal('Confirm meeting', `
    <div class="view-sub" style="margin-bottom:10px;">${escapeHtml(m.title)} — requested by ${escapeHtml(studentName(m.studentId))}</div>
    <label class="field-label">Date</label>
    <input type="date" class="text-input" id="f_confirmDate" value="${m.plannedDate}">
    <div class="two-col">
      <div><label class="field-label">From (optional)</label>
        <input type="time" class="text-input" id="f_confirmStartTime" value="${m.startTime||''}">
      </div>
      <div><label class="field-label">To (optional)</label>
        <input type="time" class="text-input" id="f_confirmEndTime" value="${m.endTime||''}">
      </div>
    </div>
    <div class="view-sub" style="margin-top:8px;">Change the date or time here if the requested slot doesn't work — the scholar will see the confirmed time, not the originally requested one.</div>
  `, ()=>submitConfirmMeeting(id));
}
async function submitConfirmMeeting(id){
  const m = state.meetings.find(x=>x.id===id);
  const newDate = document.getElementById('f_confirmDate').value;
  const newStartTime = document.getElementById('f_confirmStartTime').value;
  const newEndTime = document.getElementById('f_confirmEndTime').value;
  if(!newDate){ alert('Please set a date.'); return; }
  if(newStartTime && newEndTime && newEndTime <= newStartTime){ alert('The "To" time must be after the "From" time.'); return; }
  const reviewer = reviewerIdentity(m.studentId);
  const rescheduled = newDate !== m.plannedDate || newStartTime !== (m.startTime||'') || newEndTime !== (m.endTime||'');
  m.plannedDate = newDate;
  m.startTime = newStartTime;
  m.endTime = newEndTime;
  m.status = 'confirmed';
  m.confirmedByName = reviewer.name;
  m.confirmedByRole = reviewer.roleLabel;
  m.confirmedAt = nowIST();
  m.lastUpdate = todayStr();
  await saveCollection('meetings', state.meetings);
  if(rescheduled){
    apiNotify('meetingRescheduled', { studentId: m.studentId, title: m.title, date: fmtDate(newDate), time: fmtTimeRange(newStartTime, newEndTime), reviewedByName: reviewer.name, reviewedByRole: reviewer.roleLabel });
  }
  closeModal(); renderView();
}

async function submitCancelMeeting(id){

async function deleteMeeting(id){

/* ============================ EVENTS ============================ */
// Organized by the supervisor (or a mentor, for their assigned scholars):
// group events, the supervisor's own proposal submissions, and research
// tasks assigned to a specific scholar. Unlike most sections, there's no
// approve/reject workflow here — the supervisor's word is already final,
// so entries are simply logged and tracked.
function visibleEvents(){
  if(state.identity.role === 'student'){
    return state.events.filter(e => !e.assignedStudentId || e.assignedStudentId === state.identity.id);
  }
  if(state.identity.role === 'cosupervisor'){
    const ids = assignedStudentIds();
    return state.events.filter(e => !e.assignedStudentId || ids.includes(e.assignedStudentId));
  }
  return state.events; // true supervisor sees everything
}
function viewEvents(){
  const list = visibleEvents().slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Events</div>
        <div class="view-sub">Group events, proposal submissions, and research tasks organized or assigned by the supervisor.</div>
      </div>
      ${isSupervisorLike() ? `<button class="action-btn" onclick="openEventModal()">+ Log event / task</button>` : ''}
    </div>
    ${list.length===0 ? emptyState('Nothing logged yet', isSupervisorLike() ? 'Log a group event, a proposal submission, or assign a research task to a scholar.' : 'Anything the supervisor organizes or assigns to you will appear here.') : list.map((ev,i)=>eventCard(ev,i,list.length)).join('')}
  `;
}
function eventCard(ev, i, total){
  const canManage = isSupervisorLike();
  const st = EVENT_STATUSES[ev.status] || EVENT_STATUSES.planned;
  const isAssignedToMe = state.identity.role==='student' && ev.assignedStudentId === state.identity.id;
  const overdue = ev.date && ev.status!=='completed' && ev.date < todayStr();
  return `
    <div class="entry-card cat-purple" id="item-event-${ev.id}">
      <div class="entry-top">
        <div>
          <div class="entry-idx">EV${String(total-i).padStart(2,'0')} · ${escapeHtml(ev.type)}</div>
          <div class="entry-title">${escapeHtml(ev.title)}</div>
          <div class="entry-meta">${ev.assignedStudentId ? 'Assigned to: ' + escapeHtml(studentName(ev.assignedStudentId)) : 'Visible to all research scholars'}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
          <span class="stamp ${st.cls}">${st.label}</span>
          ${overdue ? `<span class="stamp bad">Overdue</span>` : ''}
        </div>
      </div>
      <div class="entry-grid">
        <div class="entry-block"><span class="lbl">Date</span>${ev.date ? fmtDate(ev.date) : 'not set'}</div>
        ${ev.link ? `<div class="entry-block"><span class="lbl">Link</span><a href="${escapeHtml(ev.link)}" target="_blank" rel="noopener">Open ↗</a></div>` : ''}
        ${ev.description ? `<div class="entry-block" style="grid-column:1/-1;"><span class="lbl">Description</span>${nl2br(ev.description)}</div>` : ''}
      </div>
      <div class="entry-actions">
        ${(canManage || isAssignedToMe) ? `
          <select class="small-btn" style="padding-right:6px;" onchange="setEventStatus('${ev.id}', this.value)">
            <option value="planned" ${ev.status==='planned'?'selected':''}>Planned</option>

            <option value="completed" ${ev.status==='completed'?'selected':''}>Completed</option>

const REPORT_SECTIONS = {
  weekly:        { label:'Weekly Plan',            list: () => state.weekly },
  fabrication:   { label:'Lab Work',                list: () => state.fabricationItems },
  samples:       { label:'Characterization',        list: () => state.samples },
  resultsAnalysis:{ label:'Results Analysis',       list: () => state.resultsAnalysis },
  papers:        { label:'Paper Pipeline',           list: () => state.papers },
  proposal:      { label:'Work Plan (Proposal)',    list: () => state.proposals },
  thesis:        { label:'Thesis Plan',              list: () => state.thesisPlans },
  rac:           { label:'RAC Reviews',              list: () => state.racReviews },
  conferences:   { label:'Conferences',              list: () => state.conferences },
  financial:     { label:'Proposals',                list: () => state.financialApps },
  learning:      { label:'Learning & Courses',       list: () => state.courses },
};
// Every section's records look different, so this normalizes any one of
// them down to a common shape (title / status / date / detail) that a
// single generic table and CSV export can both work from.
function normalizeReportRow(sectionKey, item){
  switch(sectionKey){
    case 'weekly': return { title:`Week of ${fmtDate(item.weekStart)}`, status:item.status, date:item.weekStart, detail:item.workDone||'' };
    case 'fabrication': return { title:fabricationLabel(item), status:item.approvalStatus, date:item.startDate||item.lastUpdate||'', detail:(FABRICATION_STAGES[item.stage]||{}).label||'' };
    case 'samples': return { title:item.sampleName, status:item.approvalStatus, date:item.submittedDate, detail:item.technique||'' };
    case 'resultsAnalysis': return { title:item.title, status:item.approvalStatus, date:item.targetDate||item.lastUpdate||'', detail:(ANALYSIS_STATUSES[item.status]||{}).label||'' };
    case 'papers': return { title:item.title, status:item.stage, date:item.lastUpdate||'', detail:item.targetJournal||'' };
    case 'proposal': return { title:item.title, status:item.status, date:item.lastUpdate||'', detail:item.objective||'' };
    case 'thesis': return { title:item.title, status:item.status, date:item.lastUpdate||'', detail:`${(item.chapters||[]).length} chapter(s)` };
    case 'rac': return { title:item.title, status:item.status, date:item.reviewDate, detail:item.comments||'' };
    case 'conferences': return { title:item.eventName, status:item.approvalStatus, date:item.startDate, detail:item.role||'' };
    case 'financial': return { title:item.title, status:item.approvalStatus, date:item.applicationDate, detail:item.type||'' };
    case 'learning': return { title:item.title, status:item.approvalStatus, date:item.startDate, detail:item.provider||'' };
    default: return { title:'', status:'', date:'', detail:'' };
  }
}
function buildReportForSection(sectionKey){
  const section = REPORT_SECTIONS[sectionKey];
  const rawList = scopedList(section.list());
  const rows = rawList.map(item => ({ studentId:item.studentId, ...normalizeReportRow(sectionKey, item) }))
    .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return { sectionKey, sectionLabel: section.label, rows };
}
function generateSectionReport(){
  if(!state.reportSectionKey) state.reportSectionKey = 'weekly';

function inRange(dateStr, from, to){
  if(!dateStr) return !from && !to ? true : false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

function buildReportForStudent(studentId, from, to){
  const instructions = state.instructions.filter(x=>x.studentId===studentId && inRange(x.date, from, to)).sort((a,b)=>a.date.localeCompare(b.date));
  const weekly = state.weekly.filter(x=>x.studentId===studentId && inRange(x.weekStart, from, to)).sort((a,b)=>a.weekStart.localeCompare(b.weekStart));
  const samples = state.samples.filter(x=>x.studentId===studentId && inRange(x.submittedDate, from, to)).sort((a,b)=>a.submittedDate.localeCompare(b.submittedDate));
  const papers = state.papers.filter(x=>x.studentId===studentId && inRange(x.lastUpdate, from, to)).sort((a,b)=>(a.lastUpdate||'').localeCompare(b.lastUpdate||''));
  const meetings = state.meetings.filter(x=>x.studentId===studentId && inRange(x.plannedDate, from, to)).sort((a,b)=>(a.plannedDate||'').localeCompare(b.plannedDate||''));
  return { studentId, name: studentName(studentId), instructions, weekly, samples, papers, meetings };
}

function generateReport(){
  const from = state.reportFrom, to = state.reportTo;
  const studentIds = state.reportStudentId==='all' ? visibleStudentsForIdentity().map(s=>s.id) : [state.reportStudentId];
  if(studentIds.length===0){ alert('No research scholars to report on yet.'); return; }
  state.reportData = {
    kind: 'student',
    generatedAt: todayStr(), from, to,

  };

  setTimeout(()=>{ document.getElementById('reportPrintArea')?.scrollIntoView({behavior:'smooth'}); }, 50);
}
function buildReportForPaper(paperId){
  const p = state.papers.find(x=>x.id===paperId);
  const weekly = state.weekly.filter(w=>(w.linkedPaperIds||[]).includes(paperId)).sort((a,b)=>a.weekStart.localeCompare(b.weekStart));
  const fabrication = state.fabricationItems.filter(it=>(it.linkedPaperIds||[]).includes(paperId)).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
  const analysis = state.resultsAnalysis.filter(a=>(a.linkedPaperIds||[]).includes(paperId)).sort((a,b)=>(a.lastUpdate||'').localeCompare(b.lastUpdate||''));
  const thesisLinks = [];
  state.thesisPlans.forEach(tp=>{
    (tp.chapters||[]).forEach(c=>{
      if(c.linkedPaperId===paperId) thesisLinks.push({ thesisTitle: tp.title, chapterTitle: c.title, status: c.status });
    });
  });
  return { paper: p, weekly, fabrication, analysis, thesisLinks };
}

  if(!state.reportPaperId){ alert('Choose a paper first.'); return; }

function downloadReportText(){
  const data = state.reportData;
  if(!data) return;
  if(data.kind === 'paper'){ downloadPaperReportText(data); return; }
  const periodLabel = (data.from || data.to) ? `${data.from ? fmtDate(data.from) : 'Start'} - ${data.to ? fmtDate(data.to) : 'Present'}` : 'All time';
  let out = `RESEARCH GROUP LOGBOOK — PROGRESS REPORT\nGenerated ${fmtDate(data.generatedAt)}\nPeriod: ${periodLabel}\n`;
  data.students.forEach(s=>{
    out += `\n${'='.repeat(60)}\n${s.name}\n${'='.repeat(60)}\n`;
    out += `\n-- Supervisor Instructions Log --\n`;
    if(s.instructions.length===0) out += `(none logged for this period)\n`;
    s.instructions.forEach(ins=>{ out += `[${fmtDate(ins.date)}] (logged by ${ins.addedByName})\n${ins.text}\n\n`; });
    out += `\n-- Weekly Plan Log --\n`;
    if(s.weekly.length===0) out += `(none logged for this period)\n`;
    s.weekly.forEach(w=>{
      out += `[Week of ${fmtDate(w.weekStart)}] Status: ${w.status}\nWork done: ${w.workDone}\nPlan for next week: ${w.planNext}\n`;
      if(w.challenges) out += `Challenges: ${w.challenges}\n`;
      if(w.supervisorComment) out += `Supervisor feedback: ${w.supervisorComment}\n`;
      out += `\n`;
    });
    out += `\n-- Characterization Samples Log --\n`;
    if(s.samples.length===0) out += `(none logged for this period)\n`;
    s.samples.forEach(sm=>{
      out += `${sm.sampleName} — ${sm.technique} | Submitted: ${fmtDate(sm.submittedDate)} | Results: ${sm.resultsReceivedDate?fmtDate(sm.resultsReceivedDate):'pending'} | ${sm.approvalStatus}\n`;
      if(sm.supervisorNote) out += `  Supervisor note: ${sm.supervisorNote}\n`;
    });
    out += `\n-- Paper Pipeline Log --\n`;
    if(s.papers.length===0) out += `(none logged for this period)\n`;
    s.papers.forEach(p=>{
      out += `${p.title} | Journal: ${p.targetJournal||'—'} | Stage: ${p.stage}${p.pendingStage?` (proposed: ${p.pendingStage})`:''} | Updated: ${fmtDate(p.lastUpdate)}\n`;
      if(p.supervisorNote) out += `  Supervisor note: ${p.supervisorNote}\n`;
    });
    out += `\n-- Meetings Log --\n`;
    if(s.meetings.length===0) out += `(none logged for this period)\n`;
    s.meetings.forEach(m=>{
      out += `[${fmtDate(m.plannedDate)}] ${m.type}: ${m.title} | Status: ${(MEETING_STATUS[m.status]||{label:m.status}).label}\n`;
      if(m.agenda) out += `  Agenda: ${m.agenda}\n`;
      if(m.outcomeNotes) out += `  Notes: ${m.outcomeNotes}\n`;
    });
  });
  downloadTextBlob(out, `progress-report-${todayStr()}.txt`);
}
function downloadPaperReportText(data){
  const p = data.paper;
  if(!p) return;
  let out = `RESEARCH GROUP LOGBOOK — PAPER REPORT\nGenerated ${fmtDate(data.generatedAt)}\nResearch Scholar: ${studentName(p.studentId)}\n`;
  out += `\n${'='.repeat(60)}\n${p.title}\n${'='.repeat(60)}\n`;
  out += `Target journal: ${p.targetJournal||'—'} | Stage: ${p.stage}${p.pendingStage?` (proposed: ${p.pendingStage})`:''}${p.targetDate?` | Target date: ${fmtDate(p.targetDate)}`:''}\n`;
  if(p.manuscriptLink) out += `Manuscript / draft: ${p.manuscriptLink}\n`;
  if(p.notes) out += `Notes: ${p.notes}\n`;
  if(p.supervisorNote) out += `Supervisor note: ${p.supervisorNote}\n`;

  out += `\n-- Reference Links --\n`;
  const refLinks = p.referenceLinks || [];
  if(refLinks.length===0) out += `(none added)\n`;
  refLinks.forEach(l=>{ out += `${l.label||'—'}: ${l.url}\n`; });

  out += `\n-- Consolidated Weekly Updates --\n`;
  if(data.weekly.length===0) out += `(no weekly plans linked to this paper yet)\n`;
  data.weekly.forEach(w=>{ out += `[Week of ${fmtDate(w.weekStart)}]\n${w.workDone}\n\n`; });

  out += `\n-- Lab Work Linked to This Paper --\n`;
  if(data.fabrication.length===0) out += `(none linked)\n`;
  data.fabrication.forEach(it=>{ out += `${fabricationLabel(it)} | Stage: ${(FABRICATION_STAGES[it.stage]||{label:it.stage}).label} | Started: ${it.startDate?fmtDate(it.startDate):'—'} | Target: ${it.targetDate?fmtDate(it.targetDate):'—'}\n`; });

  out += `\n-- Results Analysis Linked to This Paper --\n`;
  if(data.analysis.length===0) out += `(none linked)\n`;
  data.analysis.forEach(a=>{ out += `${a.title} | Status: ${(ANALYSIS_STATUSES[a.status]||{label:a.status}).label} | Target: ${a.targetDate?fmtDate(a.targetDate):'—'}\n`; });

  out += `\n-- Thesis Chapters Linked to This Paper --\n`;
  if(data.thesisLinks.length===0) out += `(none linked)\n`;
  data.thesisLinks.forEach(t=>{ out += `${t.thesisTitle} — ${t.chapterTitle} | Status: ${t.status}\n`; });

  downloadTextBlob(out, `paper-report-${todayStr()}.txt`);
}
function downloadTextBlob(text, filename){
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- CSV export ---------------- */
function csvEscape(val){
  const str = (val===undefined || val===null) ? '' : String(val);
  if(/[",\n]/.test(str)) return '"' + str.replace(/"/g,'""') + '"';
  return str;
}
function rowsToCsv(headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r => lines.push(r.map(csvEscape).join(',')));
  return lines.join('\r\n');
}
function downloadCsvBlob(csvText, filename){
  // Leading BOM so Excel opens UTF-8 (e.g. "—", "→") correctly instead of showing garbled characters.
  const blob = new Blob(['\ufeff' + csvText], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function slugify(text){
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}
function downloadReportCsv(){
  const data = state.reportData;
  if(!data) return;
  let headers, rows, filename;

  if(data.kind === 'section'){
    headers = ['Research Scholar', 'Title', 'Status', 'Date', 'Detail'];
    rows = data.rows.map(r => [studentName(r.studentId), r.title, r.status||'', r.date?fmtDate(r.date):'', r.detail||'']);
    filename = `${slugify(data.sectionLabel)}-report-${todayStr()}.csv`;

  } else if(data.kind === 'paper'){
    headers = ['Section', 'Title', 'Status', 'Date', 'Detail'];
    rows = [];
    const p = data.paper;
    if(p) rows.push(['Paper', p.title, p.stage, p.lastUpdate?fmtDate(p.lastUpdate):'', p.targetJournal||'']);
    data.weekly.forEach(w => rows.push(['Weekly Plan', `Week of ${fmtDate(w.weekStart)}`, w.status, fmtDate(w.weekStart), (w.workDone||'').slice(0,300)]));
    data.fabrication.forEach(it => rows.push(['Lab Work', fabricationLabel(it), it.approvalStatus, it.startDate?fmtDate(it.startDate):'', (FABRICATION_STAGES[it.stage]||{}).label||'']));
    (data.analysis||[]).forEach(a => rows.push(['Results Analysis', a.title, a.approvalStatus, a.targetDate?fmtDate(a.targetDate):'', (ANALYSIS_STATUSES[a.status]||{}).label||'']));
    data.thesisLinks.forEach(t => rows.push(['Thesis Chapter', `${t.thesisTitle} — ${t.chapterTitle}`, t.status, '', '']));
    filename = `paper-report-${slugify(p ? p.title : 'unknown')}-${todayStr()}.csv`;

  } else {
    headers = ['Research Scholar', 'Section', 'Title', 'Status', 'Date', 'Detail'];
    rows = [];
    data.students.forEach(s => {
      s.instructions.forEach(ins => rows.push([s.name, 'Instruction', `Logged ${fmtDate(ins.date)}`, ins.done?'Done':'Open', ins.date?fmtDate(ins.date):'', (ins.text||'').slice(0,300)]));
      s.weekly.forEach(w => rows.push([s.name, 'Weekly Plan', `Week of ${fmtDate(w.weekStart)}`, w.status, fmtDate(w.weekStart), (w.workDone||'').slice(0,300)]));
      s.samples.forEach(sm => rows.push([s.name, 'Characterization', sm.sampleName, sm.approvalStatus, sm.submittedDate?fmtDate(sm.submittedDate):'', sm.technique||'']));
      s.papers.forEach(p => rows.push([s.name, 'Paper Pipeline', p.title, p.stage, p.lastUpdate?fmtDate(p.lastUpdate):'', p.targetJournal||'']));
      s.meetings.forEach(m => rows.push([s.name, 'Meeting', m.title, m.status, m.plannedDate?fmtDate(m.plannedDate):'', m.type||'']));
    });
    filename = `progress-report-${todayStr()}.csv`;
  }

  downloadCsvBlob(rowsToCsv(headers, rows), filename);
}

function showModal(title, bodyHtml, onSubmit){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          ${bodyHtml}
          <div class="modal-foot">
            <button class="small-btn" onclick="closeModal()">Cancel</button>
            <button class="action-btn" id="modalSubmitBtn">Save</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalSubmitBtn').onclick = onSubmit;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
